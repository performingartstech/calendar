<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>DPAT Calendar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --brand-primary: #cc0000;
      --brand-primary-dark: #990000;
      --white: #ffffff;
      --black: #000000;
      --dark-gray: #333333;
      --mid-gray: #666666;
      --light-gray: #cccccc;
      --very-light-gray: #f2f2f2;
      --max-width: 1400px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body,
    button,
    input {
      font-family: "Roboto", Arial, sans-serif;
    }

    body {
      background: var(--white);
      color: var(--dark-gray);
    }


    /* Header */

    .site-header {
      width: 100%;
      background: var(--brand-primary);
    }

    .site-header-inner {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 32px;
    }

    .site-identifier {
      display: inline-block;
      padding: 14px 0;
      line-height: 0;
      text-decoration: none;
    }

    .site-identifier img {
      display: block;
      width: auto;
      max-width: min(420px, 100%);
      height: 28px;

      transition:
        opacity 160ms ease,
        filter 160ms ease;
    }

    .site-identifier:hover img,
    .site-identifier:focus img {
      opacity: 0.78;
    }

    .site-identifier:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 4px;
    }


    /* Main */

    .calendar-page {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 30px 32px 50px;
    }


    /* Toolbar */

    .calendar-toolbar {
      display: flex;
      align-items: center;
      gap: 26px;

      width: 100%;
      margin-bottom: 28px;
    }


    /* Search */

    .calendar-search {
      display: flex;
      flex: 0 0 360px;

      width: 360px;
      height: 50px;

      margin: 0;
    }

    .calendar-search input {
      flex: 1 1 auto;

      width: 100%;
      min-width: 0;
      height: 50px;

      margin: 0;
      padding: 0 16px;

      border: 1px solid #999999;
      border-right: 0;
      border-radius: 0;

      background: var(--white);
      color: var(--dark-gray);

      font-size: 18px;

      appearance: none;
      -webkit-appearance: none;
    }

    .calendar-search input::placeholder {
      color: var(--mid-gray);
      opacity: 1;
    }

    .calendar-search input:focus {
      position: relative;
      z-index: 2;

      outline: 2px solid var(--brand-primary);
      outline-offset: -2px;
    }

    .calendar-search button {
      display: flex;
      flex: 0 0 50px;

      align-items: center;
      justify-content: center;

      width: 50px;
      height: 50px;

      margin: 0;
      padding: 0;

      border: 0;
      border-radius: 0;

      background: var(--brand-primary);
      color: var(--white);

      cursor: pointer;
    }

    .calendar-search button:hover,
    .calendar-search button:focus {
      background: var(--brand-primary-dark);
    }

    .calendar-search button:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 2px;
    }

    .calendar-search svg {
      width: 22px;
      height: 22px;
    }


    /* Primary filters */

    .primary-filters {
      position: relative;

      display: flex;
      flex: 1 1 auto;

      align-items: center;
      gap: 28px;

      min-width: 0;
    }

    .primary-filter,
    .more-button {
      appearance: none;
      -webkit-appearance: none;

      flex: 0 0 auto;

      margin: 0;
      padding: 8px 0 10px;

      border: 0;
      border-radius: 0;

      background: transparent;
      color: var(--dark-gray);

      font-size: 18px;
      font-weight: 400;
      line-height: 1.25;

      white-space: nowrap;

      cursor: pointer;

      transition: color 160ms ease;
    }

    .primary-filter:hover,
    .primary-filter:focus,
    .more-button:hover,
    .more-button:focus {
      color: var(--brand-primary);
    }

    .primary-filter.active {
      color: var(--brand-primary);
      font-weight: 500;
    }

    .primary-filter:focus-visible,
    .more-button:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 3px;
    }


    /* Sliding underline */

    .filter-indicator {
      position: absolute;

      bottom: 3px;
      left: 0;

      width: 0;
      height: 3px;

      background: var(--brand-primary);

      pointer-events: none;

      transform: translateX(0);

      transition:
        transform 260ms cubic-bezier(.4, 0, .2, 1),
        width 260ms cubic-bezier(.4, 0, .2, 1);
    }


    /* More */

    .more-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .more-button.active {
      color: var(--brand-primary);
    }

    .more-caret {
      width: 8px;
      height: 8px;

      margin-top: -4px;

      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;

      transform: rotate(45deg);

      transition:
        transform 180ms ease,
        margin-top 180ms ease;
    }

    .more-button[aria-expanded="true"] .more-caret {
      margin-top: 4px;
      transform: rotate(225deg);
    }


    /* Share */

    .share-button {
      appearance: none;
      -webkit-appearance: none;

      display: flex;
      flex: 0 0 44px;

      align-items: center;
      justify-content: center;

      width: 44px;
      height: 44px;

      margin: 0 0 0 auto;
      padding: 0;

      border: 0;
      border-radius: 0;

      background: transparent;
      color: var(--dark-gray);

      cursor: pointer;

      transition:
        color 150ms ease,
        background-color 150ms ease;
    }

    .share-button:hover,
    .share-button:focus {
      color: var(--brand-primary);
      background: var(--very-light-gray);
    }

    .share-button:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 2px;
    }

    .share-button svg {
      width: 26px;
      height: 26px;
    }


    /* More filter area */

    .more-panel {
      display: grid;
      grid-template-rows: 0fr;

      margin: -10px 0 0;

      border-top: 1px solid transparent;
      border-bottom: 1px solid transparent;

      transition:
        grid-template-rows 220ms ease,
        margin 220ms ease,
        border-color 220ms ease;
    }

    .more-panel.open {
      grid-template-rows: 1fr;

      margin: -10px 0 28px;

      border-top-color: var(--light-gray);
      border-bottom-color: var(--light-gray);
    }

    .more-panel-inner {
      min-height: 0;
      overflow: hidden;
    }

    .more-panel-content {
      display: flex;
      align-items: center;
      gap: 24px;

      padding: 0;

      opacity: 0;

      transform: translateY(-4px);

      transition:
        opacity 180ms ease,
        transform 220ms ease,
        padding 220ms ease;
    }

    .more-panel.open .more-panel-content {
      padding: 20px 0;

      opacity: 1;
      transform: translateY(0);
    }

    .more-label {
      flex: 0 0 auto;

      margin: 0;

      font-size: 15px;
      font-weight: 700;
    }

    .event-type-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .event-type-filter {
      appearance: none;
      -webkit-appearance: none;

      margin: 0;
      padding: 8px 14px;

      border: 1px solid #999999;
      border-radius: 0;

      background: var(--white);
      color: var(--dark-gray);

      font-size: 15px;
      font-weight: 400;

      cursor: pointer;

      transition:
        color 140ms ease,
        border-color 140ms ease,
        background-color 140ms ease;
    }

    .event-type-filter:hover,
    .event-type-filter:focus {
      border-color: var(--brand-primary);
      color: var(--brand-primary);
    }

    .event-type-filter.active {
      border-color: var(--brand-primary);

      background: var(--brand-primary);
      color: var(--white);
    }

    .event-type-filter.active:hover,
    .event-type-filter.active:focus {
      border-color: var(--brand-primary-dark);

      background: var(--brand-primary-dark);
      color: var(--white);
    }

    .event-type-filter:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 2px;
    }


    /* Localist */

    #localist-widget-dpat {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    #calendar-status {
      margin: 0 0 18px;

      color: var(--mid-gray);
      font-size: 14px;
    }

    #calendar-status:empty {
      display: none;
    }


    /* Responsive */

    @media (max-width: 1050px) {

      .calendar-toolbar {
        flex-wrap: wrap;
        gap: 16px 22px;
      }

      .calendar-search {
        flex: 1 1 300px;
      }

      .share-button {
        margin-left: auto;
      }

      .primary-filters {
        order: 3;

        flex: 0 0 100%;

        width: 100%;

        overflow-x: auto;
        overflow-y: hidden;

        scrollbar-width: none;

        -webkit-overflow-scrolling: touch;
      }

      .primary-filters::-webkit-scrollbar {
        display: none;
      }

    }


    @media (max-width: 650px) {

      .site-header-inner {
        padding: 0 18px;
      }

      .site-identifier {
        padding: 12px 0;
      }

      .site-identifier img {
        max-width: 100%;
        height: 24px;
      }

      .calendar-page {
        padding: 22px 18px 40px;
      }

      .calendar-toolbar {
        gap: 16px;
      }

      .calendar-search {
        flex: 1 1 calc(100% - 60px);

        width: auto;
      }

      .primary-filters {
        gap: 24px;
      }

      .primary-filter,
      .more-button {
        font-size: 17px;
      }

      .more-panel-content {
        display: block;
      }

      .more-label {
        margin-bottom: 12px;
      }

    }


    @media (prefers-reduced-motion: reduce) {

      .filter-indicator,
      .more-panel,
      .more-panel-content,
      .more-caret {
        transition: none;
      }

    }
  </style>
</head>


<body>

  <header class="site-header">
    <div class="site-header-inner">

      <a
        href="#"
        class="site-identifier"
        id="site-identifier"
        aria-label="Return to previous page"
      >
        <img
          src="D_pat_identifier_RGB_mono_white.svg"
          alt="NC State Department of Performing Arts and Technology"
        >
      </a>

    </div>
  </header>


  <main class="calendar-page">

    <div class="calendar-toolbar">

      <form
        class="calendar-search"
        id="calendar-search-form"
        role="search"
      >

        <label
          for="calendar-search-input"
          style="
            position:absolute;
            width:1px;
            height:1px;
            padding:0;
            margin:-1px;
            overflow:hidden;
            clip:rect(0,0,0,0);
            white-space:nowrap;
            border:0;
          "
        >
          Search events
        </label>

        <input
          type="search"
          id="calendar-search-input"
          placeholder="Search events"
          autocomplete="off"
        >

        <button
          type="submit"
          aria-label="Search events"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              cx="10.5"
              cy="10.5"
              r="6.25"
              fill="none"
              stroke="currentColor"
              stroke-width="2.25"
            ></circle>

            <path
              d="M15.25 15.25L20.5 20.5"
              fill="none"
              stroke="currentColor"
              stroke-width="2.25"
            ></path>
          </svg>
        </button>

      </form>


      <div
        class="primary-filters"
        id="primary-filters"
      >

        <button
          type="button"
          class="primary-filter active"
          id="filter-all"
        >
          All
        </button>

        <button
          type="button"
          class="primary-filter"
          data-area="music"
        >
          Music
        </button>

        <button
          type="button"
          class="primary-filter"
          data-area="dance"
        >
          Dance
        </button>

        <button
          type="button"
          class="primary-filter"
          data-area="arts"
        >
          Arts Entrepreneurship
        </button>

        <button
          type="button"
          class="primary-filter"
          data-area="tech"
        >
          Music Technology
        </button>

        <button
          type="button"
          class="more-button"
          id="more-button"
          aria-expanded="false"
          aria-controls="more-panel"
        >
          More
          <span
            class="more-caret"
            aria-hidden="true"
          ></span>
        </button>

        <span
          class="filter-indicator"
          id="filter-indicator"
          aria-hidden="true"
        ></span>

      </div>


      <button
        type="button"
        class="share-button"
        id="share-button"
        aria-label="Share calendar"
        title="Share calendar"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            fill="currentColor"
            d="M18 22q-1.25 0-2.125-.875T15 19q0-.175.025-.35t.075-.325L8.05 14.2q-.425.375-.95.588T6 15q-1.25 0-2.125-.875T3 12q0-1.25.875-2.125T6 9q.575 0 1.1.213t.95.587l7.05-4.125q-.05-.15-.075-.325T15 5q0-1.25.875-2.125T18 2q1.25 0 2.125.875T21 5q0 1.25-.875 2.125T18 8q-.575 0-1.1-.213T15.95 7.2L8.9 11.325q.05.15.075.325T9 12q0 .175-.025.35t-.075.325l7.05 4.125q.425-.375.95-.588T18 16q1.25 0 2.125.875T21 19q0 1.25-.875 2.125T18 22Z"
          ></path>
        </svg>
      </button>

    </div>


    <div
      class="more-panel"
      id="more-panel"
      aria-hidden="true"
    >
      <div class="more-panel-inner">

        <div class="more-panel-content">

          <p class="more-label">
            Event Type
          </p>

          <div class="event-type-filters">

            <button
              type="button"
              class="event-type-filter"
              data-type="performance"
              aria-pressed="false"
            >
              Performances
            </button>

            <button
              type="button"
              class="event-type-filter"
              data-type="masterclass"
              aria-pressed="false"
            >
              Master Classes
            </button>

            <button
              type="button"
              class="event-type-filter"
              data-type="audition"
              aria-pressed="false"
            >
              Auditions
            </button>

          </div>

        </div>

      </div>
    </div>


    <div
      id="calendar-status"
      aria-live="polite"
    ></div>


    <div
      id="localist-widget-dpat"
      class="localist-widget"
    ></div>

  </main>


  <script>
    (() => {

      const WIDGET_BASE =
        "https://calendar.ncsu.edu/widget/view";

      const GROUP =
        "department_of_performing_arts_and_technology";


      /*
       * AREA FILTERS
       *
       * These values should correspond to the tags you are
       * already using in Localist.
       */

      const AREA_FILTERS = {
        music: "Music",
        dance: "Dance",
        arts: "Arts Entrepreneurship",
        tech: "Music Technology"
      };


      /*
       * PUBLIC EVENT-TYPE FILTERS
       *
       * These do not have to use the same labels that
       * Localist displays publicly.
       */

      const EVENT_FILTERS = {
        performance: "Performance",
        masterclass: "Master Class Series",
        audition: "Audition"
      };


      const widget =
        document.getElementById("localist-widget-dpat");

      const searchForm =
        document.getElementById("calendar-search-form");

      const searchInput =
        document.getElementById("calendar-search-input");

      const allButton =
        document.getElementById("filter-all");

      const areaButtons =
        [...document.querySelectorAll("[data-area]")];

      const typeButtons =
        [...document.querySelectorAll("[data-type]")];

      const primaryFilters =
        document.getElementById("primary-filters");

      const indicator =
        document.getElementById("filter-indicator");

      const moreButton =
        document.getElementById("more-button");

      const morePanel =
        document.getElementById("more-panel");

      const shareButton =
        document.getElementById("share-button");

      const backLink =
        document.getElementById("site-identifier");

      const status =
        document.getElementById("calendar-status");


      let activeArea = null;
      let activeTypes = [];
      let searchTerm = "";

      let loadToken = 0;


      /*
       * URL state
       */

      function readState() {

        const params =
          new URLSearchParams(window.location.search);

        const area =
          params.get("area");

        activeArea =
          Object.prototype.hasOwnProperty.call(
            AREA_FILTERS,
            area
          )
            ? area
            : null;


        activeTypes =
          params
            .getAll("type")
            .filter(
              type =>
                Object.prototype.hasOwnProperty.call(
                  EVENT_FILTERS,
                  type
                )
            );


        searchTerm =
          params.get("q") || "";

        searchInput.value =
          searchTerm;

      }


      function writeState() {

        const url =
          new URL(window.location.href);

        url.searchParams.delete("area");
        url.searchParams.delete("type");
        url.searchParams.delete("q");


        if (activeArea) {
          url.searchParams.set(
            "area",
            activeArea
          );
        }


        activeTypes.forEach(
          type => {
            url.searchParams.append(
              "type",
              type
            );
          }
        );


        if (searchTerm) {
          url.searchParams.set(
            "q",
            searchTerm
          );
        }


        history.replaceState(
          null,
          "",
          url
        );

      }


      /*
       * Controls
       */

      function activePrimaryButton() {

        if (!activeArea) {
          return allButton;
        }

        return (
          areaButtons.find(
            button =>
              button.dataset.area === activeArea
          ) || allButton
        );

      }


      function moveIndicator(animate = true) {

        const button =
          activePrimaryButton();

        if (!button) {
          return;
        }


        if (!animate) {
          indicator.style.transition = "none";
        }


        const parentRect =
          primaryFilters.getBoundingClientRect();

        const buttonRect =
          button.getBoundingClientRect();


        const x =
          buttonRect.left -
          parentRect.left +
          primaryFilters.scrollLeft;


        indicator.style.width =
          `${buttonRect.width}px`;

        indicator.style.transform =
          `translateX(${x}px)`;


        if (!animate) {

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              indicator.style.transition = "";
            });
          });

        }

      }


      function updateControls(animate = true) {

        const allActive =
          activeArea === null;


        allButton.classList.toggle(
          "active",
          allActive
        );

        allButton.setAttribute(
          "aria-pressed",
          String(allActive)
        );


        areaButtons.forEach(
          button => {

            const active =
              button.dataset.area === activeArea;

            button.classList.toggle(
              "active",
              active
            );

            button.setAttribute(
              "aria-pressed",
              String(active)
            );

          }
        );


        typeButtons.forEach(
          button => {

            const active =
              activeTypes.includes(
                button.dataset.type
              );

            button.classList.toggle(
              "active",
              active
            );

            button.setAttribute(
              "aria-pressed",
              String(active)
            );

          }
        );


        moreButton.classList.toggle(
          "active",
          activeTypes.length > 0
        );


        requestAnimationFrame(
          () => moveIndicator(animate)
        );

      }


      /*
       * More panel
       */

      function openMore() {

        morePanel.classList.add("open");

        morePanel.setAttribute(
          "aria-hidden",
          "false"
        );

        moreButton.setAttribute(
          "aria-expanded",
          "true"
        );

      }


      function closeMore() {

        morePanel.classList.remove("open");

        morePanel.setAttribute(
          "aria-hidden",
          "true"
        );

        moreButton.setAttribute(
          "aria-expanded",
          "false"
        );

      }


      moreButton.addEventListener(
        "click",
        () => {

          if (
            morePanel.classList.contains("open")
          ) {
            closeMore();
          }
          else {
            openMore();
          }

        }
      );


      /*
       * Build a Localist widget request.
       *
       * IMPORTANT:
       * all_instances=1 is permanent.
       */

      function buildWidgetURL(
        containerId,
        type = null
      ) {

        const params =
          new URLSearchParams();

        params.set("schools", "ncsu");

        params.set(
          "groups",
          GROUP
        );

        params.set("days", "365");
        params.set("num", "50");

        /*
         * Always show every matching instance.
         */
        params.set("all_instances", "1");

        params.set(
          "experience",
          "inperson"
        );

        params.set(
          "container",
          containerId
        );

        params.set(
          "template",
          "widget-template-7"
        );


        const tags = [];


        if (activeArea) {
          tags.push(
            AREA_FILTERS[activeArea]
          );
        }


        if (type) {
          tags.push(
            EVENT_FILTERS[type]
          );
        }


        if (tags.length) {

          /*
           * Both selected dimensions must match.
           */
          params.set(
            "match",
            "all"
          );

          params.set(
            "tags",
            tags.join(",")
          );

        }


        return (
          WIDGET_BASE +
          "?" +
          params.toString()
        );

      }


      /*
       * Locate Localist event cards.
       */

      function getEvents(root) {

        let events =
          [
            ...root.querySelectorAll(
              "li.lw_event_item"
            )
          ];


        if (events.length) {
          return events;
        }


        events =
          [
            ...root.querySelectorAll("li")
          ].filter(
            element =>
              element.querySelector(
                'a[href*="/event/"]'
              )
          );


        return events;

      }


      function eventKey(event) {

        const link =
          event.querySelector(
            'a[href*="/event/"]'
          );

        if (link) {
          return link.href;
        }

        return event.textContent
          .trim()
          .toLowerCase();

      }


      function openEventLinksInNewTab(root) {

        root
          .querySelectorAll(
            'a[href*="/event/"]'
          )
          .forEach(
            link => {

              link.target = "_blank";
              link.rel = "noopener noreferrer";

            }
          );

      }


      /*
       * Search the events currently displayed.
       */

      function applySearch() {

        const query =
          searchTerm
            .trim()
            .toLowerCase();


        const events =
          getEvents(widget);


        if (!events.length) {
          return;
        }


        let count = 0;


        events.forEach(
          event => {

            const text =
              event.textContent
                .toLowerCase();

            const show =
              !query ||
              text.includes(query);


            event.style.display =
              show ? "" : "none";


            if (show) {
              count++;
            }

          }
        );


        if (query) {

          status.textContent =
            count === 1
              ? "1 event found"
              : `${count} events found`;

        }
        else {
          status.textContent = "";
        }

      }


      /*
       * Load one Localist widget.
       */

      function loadOneWidget(type = null) {

        return new Promise(
          resolve => {

            const holder =
              document.createElement("div");

            const id =
              "localist-load-" +
              Date.now() +
              "-" +
              Math.random()
                .toString(36)
                .slice(2);


            holder.id = id;

            holder.style.display = "none";

            document.body.appendChild(holder);


            const script =
              document.createElement("script");

            script.src =
              buildWidgetURL(
                id,
                type
              );

            script.async = true;

            document.body.appendChild(script);


            let checks = 0;


            const timer =
              setInterval(
                () => {

                  checks++;


                  const events =
                    getEvents(holder);


                  if (
                    events.length ||
                    checks >= 40
                  ) {

                    clearInterval(timer);

                    const copies =
                      events.map(
                        event =>
                          event.cloneNode(true)
                      );


                    holder.remove();
                    script.remove();

                    resolve(copies);

                  }

                },
                125
              );

          }
        );

      }


      /*
       * Render.
       *
       * Multiple selected event types are treated as OR:
       *
       * Music + Performances + Master Classes
       *
       * means:
       *
       * (Music AND Performance)
       * OR
       * (Music AND Master Class)
       */

      async function renderCalendar() {

        const token =
          ++loadToken;


        status.textContent = "";
        widget.innerHTML = "";


        let groups;


        if (activeTypes.length) {

          groups =
            await Promise.all(
              activeTypes.map(
                type =>
                  loadOneWidget(type)
              )
            );

        }
        else {

          groups = [
            await loadOneWidget()
          ];

        }


        if (token !== loadToken) {
          return;
        }


        const seen =
          new Set();

        const events = [];


        groups
          .flat()
          .forEach(
            event => {

              const key =
                eventKey(event);

              if (seen.has(key)) {
                return;
              }

              seen.add(key);

              events.push(event);

            }
          );


        if (!events.length) {

          widget.innerHTML =
            "<p>No events found.</p>";

          return;

        }


        /*
         * Use Localist's original list classes so its
         * widget-template-7 styling remains intact.
         */

        const list =
          document.createElement("ul");

        list.className =
          "lw_event_list";


        events.forEach(
          event => {
            list.appendChild(event);
          }
        );


        widget.appendChild(list);


        openEventLinksInNewTab(widget);

        applySearch();

      }


      /*
       * Area controls
       */

      allButton.addEventListener(
        "click",
        () => {

          activeArea = null;

          updateControls();
          writeState();
          renderCalendar();

        }
      );


      areaButtons.forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              activeArea =
                button.dataset.area;

              updateControls();
              writeState();
              renderCalendar();

            }
          );

        }
      );


      /*
       * Event types:
       * multiple selections allowed.
       */

      typeButtons.forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              const type =
                button.dataset.type;


              if (
                activeTypes.includes(type)
              ) {

                activeTypes =
                  activeTypes.filter(
                    item =>
                      item !== type
                  );

              }
              else {

                activeTypes.push(type);

              }


              updateControls();
              writeState();
              renderCalendar();

            }
          );

        }
      );


      /*
       * Search
       */

      searchForm.addEventListener(
        "submit",
        event => {

          event.preventDefault();

          searchTerm =
            searchInput.value.trim();

          writeState();
          applySearch();

        }
      );


      searchInput.addEventListener(
        "input",
        () => {

          searchTerm =
            searchInput.value.trim();

          writeState();
          applySearch();

        }
      );


      /*
       * Share
       */

      shareButton.addEventListener(
        "click",
        async () => {

          searchTerm =
            searchInput.value.trim();

          writeState();


          const url =
            window.location.href;


          try {

            if (navigator.share) {

              await navigator.share({
                title:
                  "NC State Performing Arts and Technology Events",
                url
              });

              return;

            }


            await navigator.clipboard.writeText(
              url
            );


            shareButton.title =
              "Link copied";

          }
          catch (error) {

            if (
              error &&
              error.name === "AbortError"
            ) {
              return;
            }

          }

        }
      );


      /*
       * Identifier = previous page.
       *
       * This avoids hardcoding the department's parent site.
       */

      backLink.addEventListener(
        "click",
        event => {

          event.preventDefault();

          if (history.length > 1) {
            history.back();
          }

        }
      );


      /*
       * Keep indicator aligned.
       */

      primaryFilters.addEventListener(
        "scroll",
        () => moveIndicator(false),
        { passive: true }
      );


      window.addEventListener(
        "resize",
        () => moveIndicator(false)
      );


      /*
       * Initial load
       */

      readState();

      updateControls(false);


      if (activeTypes.length) {
        openMore();
      }


      renderCalendar();

    })();
  </script>

</body>
</html>
