<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Events | Performing Arts and Technology</title>

  <!-- NC State-style typography + Material Symbols Sharp -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Condensed:wght@400;500;700&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet"
  >


  <style>

    /* =====================================================
       BASE
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
    }

    body {
      font-family: "Roboto", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    button,
    input {
      font: inherit;
    }


    /* =====================================================
       ACCESSIBILITY
       ===================================================== */

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .calendar-page {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }


    /* =====================================================
       SEARCH
       ===================================================== */

    #calendar-search-form {
      display: flex;
      width: 100%;
      margin: 0 0 16px;
    }

    #calendar-search {
      flex: 1 1 auto;

      width: 100%;
      min-width: 0;
      height: 54px;

      margin: 0;
      padding: 0 16px;

      border: 1px solid #000;
      border-right: 0;
      border-radius: 0;

      background: #fff;
      color: #000;

      font-size: 18px;

      outline: none;

      appearance: none;
      -webkit-appearance: none;
    }

    #calendar-search::placeholder {
      color: #666;
      opacity: 1;
    }

    #calendar-search-form > button {
      flex: 0 0 54px;

      width: 54px;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0;
      padding: 0;

      border: 1px solid #cc0000;
      border-radius: 0;

      background: #cc0000;
      color: #fff;

      cursor: pointer;
    }

    #calendar-search-form > button:hover {
      background: #990000;
      border-color: #990000;
    }

    #calendar-search-form:focus-within {
      outline: 3px solid #6f7d1c;
      outline-offset: 3px;
    }

    .material-symbols-sharp {
      font-size: 26px;

      font-variation-settings:
        "FILL" 0,
        "wght" 400,
        "GRAD" 0,
        "opsz" 24;
    }


    /* =====================================================
       FILTER BAR
       ===================================================== */

    #calendar-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;

      gap: 9px 22px;

      width: 100%;

      margin: 0 0 22px;
      padding: 0 0 14px;

      border-bottom: 1px solid #ccc;
    }

    #calendar-filters button {
      appearance: none;
      -webkit-appearance: none;

      margin: 0;
      padding: 3px 0;

      border: 0;
      border-radius: 0;

      background: transparent;
      color: #333;

      font-family: "Roboto", Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;

      cursor: pointer;
      white-space: nowrap;
    }

    #calendar-filters button:hover {
      color: #cc0000;
    }

    #calendar-filters button:focus-visible {
      outline: 3px solid #6f7d1c;
      outline-offset: 3px;
    }

    #calendar-filters button.active {
      color: #cc0000;

      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 5px;
    }


    /* =====================================================
       MORE
       ===================================================== */

    #more-wrap {
      position: relative;
      display: inline-block;
    }

    #more-button {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    #more-button .material-symbols-sharp {
      font-size: 19px;
    }

    #more-button[aria-expanded="true"]
    .material-symbols-sharp {
      transform: rotate(180deg);
    }


    /* =====================================================
       MORE MENU
       ===================================================== */

    #more-menu {
      position: absolute;
      z-index: 1000;

      top: calc(100% + 9px);
      left: 0;

      min-width: 220px;

      margin: 0;
      padding: 6px 0;

      border: 1px solid #aaa;

      background: #fff;
      color: #000;

      box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
    }

    #more-menu[hidden] {
      display: none;
    }

    #more-menu label {
      display: flex;
      align-items: center;

      gap: 9px;

      width: 100%;

      margin: 0;
      padding: 9px 12px;

      font-size: 15px;
      line-height: 1.3;

      cursor: pointer;
      white-space: nowrap;
    }

    #more-menu label:hover {
      background: #f2f2f2;
    }

    #more-menu input {
      width: 16px;
      height: 16px;

      margin: 0;

      accent-color: #cc0000;
      cursor: pointer;
    }


    /* =====================================================
       COPY URL
       ===================================================== */

    #copy-url {
      margin-left: auto !important;
      color: #555 !important;
      font-weight: 400 !important;
    }

    #copy-url:hover {
      color: #cc0000 !important;
    }


    /* =====================================================
       STATUS
       ===================================================== */

    #calendar-status {
      margin: -10px 0 18px;
      color: #555;
      font-size: 14px;
    }

    #calendar-status:empty {
      display: none;
    }


    /* =====================================================
       LOCALIST
       ===================================================== */

    #localist-widget-dpat {
      width: 100%;
      margin: 0;
      padding: 0;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      .calendar-page {
        padding: 20px 16px 36px;
      }

      #calendar-search,
      #calendar-search-form > button {
        height: 50px;
      }

      #calendar-search {
        font-size: 16px;
      }

      #calendar-search-form > button {
        flex-basis: 50px;
        width: 50px;
      }

      #calendar-filters {
        gap: 10px 17px;
      }

      #copy-url {
        margin-left: 0 !important;
      }

    }

  </style>
</head>


<body>

<main class="calendar-page">


  <!-- =====================================================
       SEARCH
       ===================================================== -->

  <form
    id="calendar-search-form"
    role="search"
  >

    <label
      class="sr-only"
      for="calendar-search"
    >
      Search events
    </label>

    <input
      id="calendar-search"
      type="search"
      placeholder="Search"
      autocomplete="off"
    >

    <button
      type="submit"
      aria-label="Search events"
    >
      <span
        class="material-symbols-sharp"
        aria-hidden="true"
      >
        search
      </span>
    </button>

  </form>


  <!-- =====================================================
       FILTERS
       ===================================================== -->

  <div
    id="calendar-filters"
    aria-label="Filter events"
  >

    <button
      type="button"
      id="filter-all"
      class="active"
    >
      All
    </button>


    <button
      type="button"
      data-area="music"
    >
      Music
    </button>


    <button
      type="button"
      data-area="dance"
    >
      Dance
    </button>


    <button
      type="button"
      data-area="arts"
    >
      Arts Entrepreneurship
    </button>


    <button
      type="button"
      data-area="tech"
    >
      Music Technology
    </button>


    <span id="more-wrap">

      <button
        type="button"
        id="more-button"
        aria-expanded="false"
        aria-controls="more-menu"
      >
        More

        <span
          class="material-symbols-sharp"
          aria-hidden="true"
        >
          expand_more
        </span>
      </button>


      <span
        id="more-menu"
        hidden
      >

        <label>
          <input
            type="checkbox"
            data-type="performance"
          >
          Performances
        </label>

        <label>
          <input
            type="checkbox"
            data-type="masterclass"
          >
          Master Classes
        </label>

        <label>
          <input
            type="checkbox"
            data-type="audition"
          >
          Auditions
        </label>

        <label>
          <input
            type="checkbox"
            data-type="workshop"
          >
          Workshops &amp; Talks
        </label>

      </span>

    </span>


    <button
      type="button"
      id="copy-url"
      title="Copy a link to the current search and filters"
    >
      Copy URL
    </button>

  </div>


  <div
    id="calendar-status"
    aria-live="polite"
  ></div>


  <!-- =====================================================
       LOCALIST
       ===================================================== -->

  <div
    id="localist-widget-dpat"
    class="localist-widget"
  ></div>


</main>


<script>

(function () {


  /* =======================================================
     ELEMENTS
     ======================================================= */

  const container =
    document.getElementById(
      "localist-widget-dpat"
    );

  const searchForm =
    document.getElementById(
      "calendar-search-form"
    );

  const searchInput =
    document.getElementById(
      "calendar-search"
    );

  const status =
    document.getElementById(
      "calendar-status"
    );

  const allButton =
    document.getElementById(
      "filter-all"
    );

  const areaButtons =
    Array.from(
      document.querySelectorAll(
        "[data-area]"
      )
    );

  const typeBoxes =
    Array.from(
      document.querySelectorAll(
        "input[data-type]"
      )
    );

  const moreWrap =
    document.getElementById(
      "more-wrap"
    );

  const moreButton =
    document.getElementById(
      "more-button"
    );

  const moreMenu =
    document.getElementById(
      "more-menu"
    );

  const copyButton =
    document.getElementById(
      "copy-url"
    );


  /* =======================================================
     CLASSIFICATIONS

     VERIFIED LOCALIST IDS:

     Dance
     6673

     Master Class Series
     43598230166255

     Other mappings are still provisional.
     ======================================================= */

  const AREAS = {

    music: {
      tags: ["music"]
    },

    dance: {
      types: ["6673"]
    },

    arts: {
      tags: [
        "arts entrepreneurship"
      ]
    },

    tech: {
      tags: [
        "music technology"
      ]
    }

  };


  const EVENT_TYPES = {

    performance: {
      tags: ["performance"]
    },

    masterclass: {
      types: [
        "43598230166255"
      ]
    },

    audition: {
      tags: ["audition"]
    },

    workshop: {
      tags: ["workshop"]
    }

  };


  /* =======================================================
     STATE
     ======================================================= */

  let selectedAreas =
    new Set();

  let selectedEventTypes =
    new Set();

  let searchQuery = "";


  /* =======================================================
     URL STATE
     ======================================================= */

  function readPageURL() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const areas =
      (params.get("area") || "")
        .split(",")
        .filter(Boolean);


    const eventTypes =
      (params.get("type") || "")
        .split(",")
        .filter(Boolean);


    selectedAreas =
      new Set(
        areas.filter(
          key => AREAS[key]
        )
      );


    selectedEventTypes =
      new Set(
        eventTypes.filter(
          key => EVENT_TYPES[key]
        )
      );


    searchQuery =
      params.get("q") || "";


    searchInput.value =
      searchQuery;

  }


  function updatePageURL() {

    const url =
      new URL(
        window.location.href
      );


    url.searchParams.delete(
      "area"
    );

    url.searchParams.delete(
      "type"
    );

    url.searchParams.delete(
      "q"
    );


    if (selectedAreas.size) {

      url.searchParams.set(
        "area",
        Array.from(
          selectedAreas
        ).join(",")
      );

    }


    if (selectedEventTypes.size) {

      url.searchParams.set(
        "type",
        Array.from(
          selectedEventTypes
        ).join(",")
      );

    }


    if (searchQuery) {

      url.searchParams.set(
        "q",
        searchQuery
      );

    }


    window.history.replaceState(
      null,
      "",
      url
    );

  }


  /* =======================================================
     CONTROL APPEARANCE
     ======================================================= */

  function updateControls() {

    areaButtons.forEach(
      button => {

        button.classList.toggle(
          "active",
          selectedAreas.has(
            button.dataset.area
          )
        );

      }
    );


    typeBoxes.forEach(
      box => {

        box.checked =
          selectedEventTypes.has(
            box.dataset.type
          );

      }
    );


    allButton.classList.toggle(
      "active",
      selectedAreas.size === 0 &&
      selectedEventTypes.size === 0
    );


    moreButton.classList.toggle(
      "active",
      selectedEventTypes.size > 0
    );

  }


  /* =======================================================
     COLLECT FILTER VALUES
     ======================================================= */

  function collectFilters(
    selections,
    definitions
  ) {

    let types = [];
    let tags = [];


    selections.forEach(
      key => {

        const filter =
          definitions[key];


        if (!filter) {
          return;
        }


        if (filter.types) {

          types.push(
            ...filter.types
          );

        }


        if (filter.tags) {

          tags.push(
            ...filter.tags
          );

        }

      }
    );


    return {

      types:
        Array.from(
          new Set(types)
        ),

      tags:
        Array.from(
          new Set(tags)
        )

    };

  }


  /* =======================================================
     BUILD LOCALIST URL

     IMPORTANT:

     Area and event-type selections are kept conceptually
     separate.

     If both an area AND an event type are selected,
     Localist is instructed to match all classifications.

     Example:

     Dance + Master Classes

     types=
       6673,
       43598230166255

     match_all=all

     ======================================================= */

  function buildWidgetURL() {

    const params =
      new URLSearchParams();


    params.set(
      "schools",
      "ncsu"
    );

    params.set(
      "groups",
      "department_of_performing_arts_and_technology"
    );

    params.set(
      "days",
      "365"
    );

    params.set(
      "num",
      "50"
    );

    params.set(
      "experience",
      "inperson"
    );

    params.set(
      "container",
      "localist-widget-dpat"
    );

    params.set(
      "template",
      "widget-template-7"
    );


    const areaFilters =
      collectFilters(
        selectedAreas,
        AREAS
      );


    const eventFilters =
      collectFilters(
        selectedEventTypes,
        EVENT_TYPES
      );


    const allTypes =
      Array.from(
        new Set([
          ...areaFilters.types,
          ...eventFilters.types
        ])
      );


    const allTags =
      Array.from(
        new Set([
          ...areaFilters.tags,
          ...eventFilters.tags
        ])
      );


    if (allTypes.length) {

      params.set(
        "types",
        allTypes.join(",")
      );

    }


    if (allTags.length) {

      params.set(
        "tags",
        allTags.join(",")
      );

    }


    /*
     * If the visitor has selected something from BOTH
     * dimensions, require the classifications to intersect.
     *
     * Dance + Master Class therefore means:
     *
     * Dance AND Master Class
     *
     * rather than:
     *
     * Dance OR Master Class
     */

    const hasArea =
      selectedAreas.size > 0;

    const hasEventType =
      selectedEventTypes.size > 0;


    if (
      hasArea &&
      hasEventType
    ) {

      params.set(
        "match_all",
        "all"
      );

    }


    return (
      "https://calendar.ncsu.edu/widget/view?" +
      params.toString()
    );

  }


  /* =======================================================
     LOAD LOCALIST
     ======================================================= */

  function loadWidget() {

    status.textContent = "";


    document
      .querySelectorAll(
        "script[data-dpat-localist]"
      )
      .forEach(
        script => script.remove()
      );


    container.innerHTML = "";


    const script =
      document.createElement(
        "script"
      );


    script.type =
      "text/javascript";

    script.defer = true;

    script.setAttribute(
      "data-dpat-localist",
      "true"
    );

    script.src =
      buildWidgetURL();


    container.parentNode.insertBefore(
      script,
      container.nextSibling
    );


    /*
     * Localist inserts its HTML asynchronously.
     */

    window.setTimeout(
      applySearch,
      800
    );

    window.setTimeout(
      applySearch,
      1600
    );

    window.setTimeout(
      applySearch,
      2800
    );

  }


  /* =======================================================
     SEARCH LOCALIST RESULTS
     ======================================================= */

  function getEventItems() {

    /*
     * Localist widget templates normally output event
     * list items. Prefer those when available.
     */

    const obviousItems =
      Array.from(
        container.querySelectorAll(
          "li.lw_event_item, li"
        )
      ).filter(
        item =>
          item.querySelector(
            'a[href*="/event/"]'
          )
      );


    if (obviousItems.length) {
      return obviousItems;
    }


    /*
     * Fallback if template markup changes.
     */

    const eventLinks =
      Array.from(
        container.querySelectorAll(
          'a[href*="/event/"]'
        )
      );


    return eventLinks
      .map(
        link =>
          link.closest("li")
      )
      .filter(
        (item, index, array) =>
          item &&
          array.indexOf(item) === index
      );

  }


  function applySearch() {

    const query =
      searchQuery
        .trim()
        .toLowerCase();


    const events =
      getEventItems();


    if (!events.length) {

      if (query) {

        status.textContent =
          "Searching events…";

      }

      return;

    }


    let visible = 0;


    events.forEach(
      event => {

        const text =
          event.textContent
            .toLowerCase()
            .replace(
              /\s+/g,
              " "
            );


        const matches =
          !query ||
          text.includes(query);


        event.style.display =
          matches
            ? ""
            : "none";


        if (matches) {
          visible++;
        }

      }
    );


    if (!query) {

      status.textContent = "";

      return;

    }


    status.textContent =
      visible === 1
        ? "1 event found"
        : visible + " events found";

  }


  /* =======================================================
     SEARCH EVENTS
     ======================================================= */

  searchForm.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();


      searchQuery =
        searchInput.value.trim();


      updatePageURL();

      applySearch();

    }
  );


  /*
   * If the visitor clears the search field using the
   * browser's X button, immediately restore the results.
   */

  searchInput.addEventListener(
    "input",
    function () {

      if (
        searchInput.value === ""
      ) {

        searchQuery = "";

        updatePageURL();

        applySearch();

      }

    }
  );


  /* =======================================================
     AREA BUTTONS
     ======================================================= */

  areaButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        function () {

          const key =
            button.dataset.area;


          if (
            selectedAreas.has(key)
          ) {

            selectedAreas.delete(
              key
            );

          } else {

            selectedAreas.add(
              key
            );

          }


          updateControls();

          updatePageURL();

          loadWidget();

        }
      );

    }
  );


  /* =======================================================
     EVENT TYPES
     ======================================================= */

  typeBoxes.forEach(
    box => {

      box.addEventListener(
        "change",
        function () {

          const key =
            box.dataset.type;


          if (box.checked) {

            selectedEventTypes.add(
              key
            );

          } else {

            selectedEventTypes.delete(
              key
            );

          }


          updateControls();

          updatePageURL();

          loadWidget();

        }
      );

    }
  );


  /* =======================================================
     ALL
     ======================================================= */

  allButton.addEventListener(
    "click",
    function () {

      selectedAreas.clear();

      selectedEventTypes.clear();


      updateControls();

      updatePageURL();

      loadWidget();

    }
  );


  /* =======================================================
     MORE MENU
     ======================================================= */

  moreButton.addEventListener(
    "click",
    function () {

      const opening =
        moreMenu.hidden;


      moreMenu.hidden =
        !opening;


      moreButton.setAttribute(
        "aria-expanded",
        opening
          ? "true"
          : "false"
      );

    }
  );


  document.addEventListener(
    "click",
    function (event) {

      if (
        !moreWrap.contains(
          event.target
        )
      ) {

        moreMenu.hidden =
          true;


        moreButton.setAttribute(
          "aria-expanded",
          "false"
        );

      }

    }
  );


  /* =======================================================
     COPY URL
     ======================================================= */

  copyButton.addEventListener(
    "click",
    async function () {

      searchQuery =
        searchInput.value.trim();


      updatePageURL();


      try {

        await navigator.clipboard.writeText(
          window.location.href
        );


        showCopied();

      } catch (error) {

        const textarea =
          document.createElement(
            "textarea"
          );


        textarea.value =
          window.location.href;

        textarea.setAttribute(
          "readonly",
          ""
        );

        textarea.style.position =
          "fixed";

        textarea.style.opacity =
          "0";


        document.body.appendChild(
          textarea
        );


        textarea.select();


        document.execCommand(
          "copy"
        );


        textarea.remove();


        showCopied();

      }

    }
  );


  function showCopied() {

    copyButton.textContent =
      "Copied!";


    window.setTimeout(
      function () {

        copyButton.textContent =
          "Copy URL";

      },
      1500
    );

  }


  /* =======================================================
     INITIALIZE
     ======================================================= */

  readPageURL();

  updateControls();

  loadWidget();


})();

</script>

</body>
</html>
