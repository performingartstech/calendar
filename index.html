<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>DPAT Calendar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --brand-primary: #cc0000;
      --brand-primary-active: #990000;

      --black: #000000;
      --white: #ffffff;

      --gray-900: #333333;
      --gray-700: #666666;
      --gray-500: #999999;
      --gray-300: #cccccc;
      --gray-100: #e5e5e5;
      --very-light-gray: #f2f2f2;

      --page-width: 1200px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body,
    input,
    button {
      font-family: "Roboto", Arial, sans-serif;
    }

    body {
      background: var(--white);
      color: var(--gray-900);
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .brand-header {
      width: 100%;
      background: var(--brand-primary);
    }

    .brand-header-inner {
      width: 100%;
      max-width: var(--page-width);
      margin: 0 auto;
      padding: 24px;
    }

    .logo-as-back-link {
      display: inline-block;

      margin: 0;
      padding: 0;

      line-height: 0;
      text-decoration: none;

      background: transparent;
    }

    .brand-header-logo {
      display: block;

      width: min(100%, 400px);
      height: auto;

      transition: opacity 160ms ease;
    }

    .logo-as-back-link:hover .brand-header-logo,
    .logo-as-back-link:focus .brand-header-logo {
      opacity: 0.82;
    }

    .logo-as-back-link:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: 5px;
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .calendar-page {
      width: 100%;
      max-width: var(--page-width);

      margin: 0 auto;
      padding: 30px 24px 50px;
    }


    /* =====================================================
       TOOLBAR
       ===================================================== */

    .calendar-toolbar {
      display: flex;
      align-items: center;

      gap: 24px;

      width: 100%;
      margin: 0 0 22px;
    }


    /* =====================================================
       SEARCH
       ===================================================== */

    .calendar-search {
      display: flex;
      align-items: stretch;

      flex: 0 0 330px;

      width: 330px;
      height: 46px;

      margin: 0;
      padding: 0;
    }

    .calendar-search input {
      appearance: none;
      -webkit-appearance: none;

      flex: 1 1 auto;

      box-sizing: border-box;

      width: 100%;
      min-width: 0;
      height: 46px;

      margin: 0;
      padding: 0 14px;

      border: 1px solid var(--gray-500);
      border-right: 0;
      border-radius: 0;

      background: var(--white);
      color: var(--gray-900);

      font: inherit;
      font-size: 16px;
      line-height: 1;
    }

    .calendar-search input::placeholder {
      color: var(--gray-700);
      opacity: 1;
    }

    .calendar-search input:focus {
      position: relative;
      z-index: 2;

      outline: 2px solid var(--brand-primary);
      outline-offset: -2px;
    }

    .calendar-search button {
      appearance: none;
      -webkit-appearance: none;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      flex: 0 0 46px;

      width: 46px;
      height: 46px;

      margin: 0;
      padding: 0;

      border: 1px solid var(--brand-primary);
      border-radius: 0;

      background: var(--brand-primary);
      color: var(--white);

      cursor: pointer;

      transition:
        background-color 150ms ease,
        border-color 150ms ease;
    }

    .calendar-search button:hover,
    .calendar-search button:focus {
      border-color: var(--brand-primary-active);
      background: var(--brand-primary-active);
    }

    .calendar-search button:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 2px;
    }

    .calendar-search svg {
      display: block;

      width: 21px;
      height: 21px;

      fill: none;
      stroke: currentColor;
    }


    /* =====================================================
       TOP FILTERS
       ===================================================== */

    .calendar-filters {
      position: relative;

      display: flex;
      align-items: center;

      gap: 26px;

      flex: 1 1 auto;

      min-width: 0;
      margin: 0;
      padding: 0;
    }

    .filter-button,
    .more-toggle,
    .clear-filters {
      appearance: none;
      -webkit-appearance: none;

      position: relative;

      flex: 0 0 auto;

      width: auto;
      min-width: 0;
      height: auto;

      margin: 0;
      padding: 8px 0 10px;

      border: 0;
      border-radius: 0;

      background: transparent;
      color: var(--gray-900);

      font: inherit;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.3;

      text-align: left;
      text-transform: none;
      white-space: nowrap;

      cursor: pointer;

      transition: color 160ms ease;
    }

    .filter-button:hover,
    .filter-button:focus,
    .more-toggle:hover,
    .more-toggle:focus {
      color: var(--brand-primary);
    }

    .filter-button.active {
      color: var(--brand-primary);
      font-weight: 500;
    }

    .filter-button:focus-visible,
    .more-toggle:focus-visible,
    .clear-filters:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 3px;
    }


    /* Sliding underline */

    .filter-indicator {
      position: absolute;

      bottom: 2px;
      left: 0;

      width: 0;
      height: 3px;

      background: var(--brand-primary);

      pointer-events: none;

      transform: translateX(0);

      transition:
        transform 260ms cubic-bezier(.4, 0, .2, 1),
        width 260ms cubic-bezier(.4, 0, .2, 1);
    }


    /* =====================================================
       MORE
       ===================================================== */

    .more-toggle {
      display: inline-flex;
      align-items: center;

      gap: 8px;
    }

    .more-toggle.active {
      color: var(--brand-primary);
    }

    .more-caret {
      display: block;

      width: 8px;
      height: 8px;

      margin-top: -4px;

      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;

      transform: rotate(45deg);

      transition:
        transform 180ms ease,
        margin-top 180ms ease;
    }

    .more-toggle[aria-expanded="true"] .more-caret {
      margin-top: 4px;

      transform: rotate(225deg);
    }


    /* =====================================================
       CLEAR FILTERS
       ===================================================== */

    .clear-filters {
      padding-left: 4px;

      color: var(--brand-primary);

      font-size: 14px;
      font-weight: 500;

      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .clear-filters:hover,
    .clear-filters:focus {
      color: var(--brand-primary-active);
    }

    .clear-filters[hidden] {
      display: none;
    }


    /* =====================================================
       SHARE
       ===================================================== */

    .share-button {
      appearance: none;
      -webkit-appearance: none;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      flex: 0 0 42px;

      width: 42px;
      height: 42px;

      margin: 0 0 0 auto;
      padding: 0;

      border: 0;
      border-radius: 0;

      background: transparent;
      color: var(--gray-900);

      cursor: pointer;

      transition:
        color 150ms ease,
        background-color 150ms ease;
    }

    .share-button:hover,
    .share-button:focus {
      background: var(--very-light-gray);
      color: var(--brand-primary);
    }

    .share-button:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 2px;
    }

    .share-button svg {
      display: block;

      width: 24px;
      height: 24px;

      fill: currentColor;
    }


    /* =====================================================
       MORE FILTER PANEL
       ===================================================== */

    .more-panel {
      display: grid;

      grid-template-rows: 0fr;

      width: 100%;

      margin: -8px 0 0;

      border-top: 1px solid transparent;
      border-bottom: 1px solid transparent;

      transition:
        grid-template-rows 220ms ease,
        margin 220ms ease,
        border-color 220ms ease;
    }

    .more-panel.open {
      grid-template-rows: 1fr;

      margin: -8px 0 28px;

      border-top-color: var(--gray-300);
      border-bottom-color: var(--gray-300);
    }

    .more-panel-inner {
      min-height: 0;
      overflow: hidden;
    }

    .more-panel-content {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 14px 22px;

      padding: 0;

      opacity: 0;

      transform: translateY(-4px);

      transition:
        opacity 180ms ease,
        transform 220ms ease,
        padding 220ms ease;
    }

    .more-panel.open .more-panel-content {
      padding: 18px 0;

      opacity: 1;

      transform: translateY(0);
    }

    .more-label {
      flex: 0 0 auto;

      margin: 0;

      color: var(--gray-900);

      font-size: 15px;
      font-weight: 700;
    }

    .event-type-filters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;

      gap: 10px;

      margin: 0;
      padding: 0;
    }

    .event-type-filter {
      appearance: none;
      -webkit-appearance: none;

      width: auto;
      min-width: 0;
      height: auto;

      margin: 0;
      padding: 8px 13px;

      border: 1px solid var(--gray-500);
      border-radius: 0;

      background: var(--white);
      color: var(--gray-900);

      font: inherit;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.25;

      cursor: pointer;

      transition:
        color 140ms ease,
        border-color 140ms ease,
        background-color 140ms ease;
    }

    .event-type-filter:hover,
    .event-type-filter:focus {
      border-color: var(--brand-primary);

      color: var(--brand-primary);
    }

    .event-type-filter.active {
      border-color: var(--brand-primary);

      background: var(--brand-primary);
      color: var(--white);
    }

    .event-type-filter.active:hover,
    .event-type-filter.active:focus {
      border-color: var(--brand-primary-active);

      background: var(--brand-primary-active);
      color: var(--white);
    }

    .event-type-filter:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 2px;
    }


    /* =====================================================
       STATUS
       ===================================================== */

    #calendar-status {
      margin: 0 0 18px;

      color: var(--gray-700);

      font-size: 14px;
    }

    #calendar-status:empty {
      display: none;
    }


    /* =====================================================
       LOCALIST
       ===================================================== */

    #localist-widget-dpat {
      clear: both;

      width: 100%;

      margin: 0;
      padding: 0;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 1050px) {

      .calendar-toolbar {
        flex-wrap: wrap;

        gap: 14px 20px;
      }

      .calendar-search {
        flex: 1 1 300px;

        width: auto;
        max-width: 430px;
      }

      .share-button {
        margin-left: auto;
      }

      .calendar-filters {
        order: 3;

        flex: 0 0 100%;

        width: 100%;

        overflow-x: auto;
        overflow-y: hidden;

        scrollbar-width: none;

        -webkit-overflow-scrolling: touch;
      }

      .calendar-filters::-webkit-scrollbar {
        display: none;
      }

    }


    @media (max-width: 700px) {

      .brand-header-inner {
        padding: 20px 16px;
      }

      .brand-header-logo {
        width: min(100%, 360px);
      }

      .calendar-page {
        padding: 22px 16px 40px;
      }

      .calendar-toolbar {
        gap: 14px;
      }

      .calendar-search {
        flex: 1 1 calc(100% - 58px);

        width: auto;
        max-width: none;
      }

      .calendar-filters {
        gap: 22px;
      }

      .filter-button,
      .more-toggle {
        font-size: 16px;
      }

      .more-panel-content {
        align-items: flex-start;
      }

      .more-label {
        flex: 0 0 100%;
      }

    }


    @media (prefers-reduced-motion: reduce) {

      .filter-indicator,
      .more-panel,
      .more-panel-content,
      .more-caret {
        transition: none;
      }

    }
  </style>
</head>


<body>

  <header class="brand-header">
    <div class="brand-header-inner">

      <a
        href="#"
        class="logo-as-back-link"
        id="logo-as-back-link"
        aria-label="Return to previous page"
      >
        <img
          class="brand-header-logo"
          src="D_pat_identifier_RGB_mono_white.svg"
          alt="NC State Department of Performing Arts and Technology"
        >
      </a>

    </div>
  </header>


  <main class="calendar-page">

    <div class="calendar-toolbar">

      <!-- Search -->

      <form
        class="calendar-search"
        id="calendar-search-form"
        role="search"
      >

        <label
          for="calendar-search-input"
          style="
            position:absolute;
            width:1px;
            height:1px;
            padding:0;
            margin:-1px;
            overflow:hidden;
            clip:rect(0,0,0,0);
            white-space:nowrap;
            border:0;
          "
        >
          Search events
        </label>

        <input
          type="search"
          id="calendar-search-input"
          placeholder="Search events"
          autocomplete="off"
        >

        <button
          type="submit"
          aria-label="Search events"
        >
          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              cx="10.5"
              cy="10.5"
              r="6.25"
              stroke-width="2.25"
            ></circle>

            <path
              d="M15.25 15.25L20.5 20.5"
              stroke-width="2.25"
            ></path>
          </svg>
        </button>

      </form>


      <!-- Top filters -->

      <div
        class="calendar-filters"
        id="calendar-filters"
      >

        <button
          type="button"
          class="filter-button active"
          id="filter-all"
          aria-pressed="true"
        >
          All
        </button>

        <button
          type="button"
          class="filter-button"
          data-area="music"
          aria-pressed="false"
        >
          Music
        </button>

        <button
          type="button"
          class="filter-button"
          data-area="dance"
          aria-pressed="false"
        >
          Dance
        </button>

        <button
          type="button"
          class="filter-button"
          data-area="arts"
          aria-pressed="false"
        >
          Arts Entrepreneurship
        </button>

        <button
          type="button"
          class="filter-button"
          data-area="tech"
          aria-pressed="false"
        >
          Music Technology
        </button>


        <button
          type="button"
          class="more-toggle"
          id="more-toggle"
          aria-expanded="false"
          aria-controls="more-panel"
        >
          More

          <span
            class="more-caret"
            aria-hidden="true"
          ></span>
        </button>


        <button
          type="button"
          class="clear-filters"
          id="clear-filters"
          hidden
        >
          Clear filters
        </button>


        <span
          class="filter-indicator"
          id="filter-indicator"
          aria-hidden="true"
        ></span>

      </div>


      <!-- Share -->

      <button
        type="button"
        class="share-button"
        id="share-button"
        aria-label="Share calendar"
        title="Share calendar"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M18 16c-.8 0-1.5.3-2 .8L8.9 12.7c.1-.2.1-.5.1-.7s0-.5-.1-.7L16 7.2c.5.5 1.2.8 2 .8 1.7 0 3-1.3 3-3s-1.3-3-3-3-3 1.3-3 3c0 .2 0 .5.1.7L8 9.8C7.5 9.3 6.8 9 6 9c-1.7 0-3 1.3-3 3s1.3 3 3 3c.8 0 1.5-.3 2-.8l7.1 4.1c-.1.2-.1.4-.1.7 0 1.7 1.3 3 3 3s3-1.3 3-3-1.3-3-3-3Z"
          ></path>
        </svg>
      </button>

    </div>


    <!-- More filters -->

    <div
      class="more-panel"
      id="more-panel"
      aria-hidden="true"
    >

      <div class="more-panel-inner">

        <div class="more-panel-content">

          <p class="more-label">
            Event Type
          </p>

          <div class="event-type-filters">

            <button
              type="button"
              class="event-type-filter"
              data-type="performances"
              aria-pressed="false"
            >
              Performances
            </button>

            <button
              type="button"
              class="event-type-filter"
              data-type="master-classes"
              aria-pressed="false"
            >
              Master Classes
            </button>

            <button
              type="button"
              class="event-type-filter"
              data-type="auditions"
              aria-pressed="false"
            >
              Auditions
            </button>

          </div>

        </div>

      </div>

    </div>


    <div
      id="calendar-status"
      aria-live="polite"
    ></div>


    <div
      id="localist-widget-dpat"
      class="localist-widget"
    ></div>

  </main>


  <script>
    (() => {

      /* ===================================================
         CONFIGURATION
         =================================================== */

      const WIDGET_BASE =
        "https://calendar.ncsu.edu/widget/view";

      const GROUP =
        "department_of_performing_arts_and_technology";


      /*
       * Area tags used in Localist.
       */

      const AREA_FILTERS = {
        music: "Music",
        dance: "Dance",
        arts: "Arts Entrepreneurship",
        tech: "Music Technology"
      };


      /*
       * Public labels can differ from the underlying
       * Localist taxonomy.
       */

      const EVENT_FILTERS = {
        "performances": {
          tags: ["Performance"]
        },

        "master-classes": {
          tags: ["Master Class Series"]
        },

        "auditions": {
          tags: ["Audition"]
        }
      };


      /* ===================================================
         ELEMENTS
         =================================================== */

      const widget =
        document.getElementById(
          "localist-widget-dpat"
        );

      const searchForm =
        document.getElementById(
          "calendar-search-form"
        );

      const searchInput =
        document.getElementById(
          "calendar-search-input"
        );

      const allButton =
        document.getElementById(
          "filter-all"
        );

      const areaButtons =
        [
          ...document.querySelectorAll(
            "[data-area]"
          )
        ];

      const typeButtons =
        [
          ...document.querySelectorAll(
            "[data-type]"
          )
        ];

      const filterBar =
        document.getElementById(
          "calendar-filters"
        );

      const indicator =
        document.getElementById(
          "filter-indicator"
        );

      const moreToggle =
        document.getElementById(
          "more-toggle"
        );

      const morePanel =
        document.getElementById(
          "more-panel"
        );

      const clearFilters =
        document.getElementById(
          "clear-filters"
        );

      const shareButton =
        document.getElementById(
          "share-button"
        );

      const backLink =
        document.getElementById(
          "logo-as-back-link"
        );

      const status =
        document.getElementById(
          "calendar-status"
        );


      /* ===================================================
         STATE
         =================================================== */

      let activeArea = null;

      let activeTypes = [];

      let searchTerm = "";

      let currentLoad = 0;


      /* ===================================================
         URL STATE
         =================================================== */

      function readURLState() {

        const params =
          new URLSearchParams(
            window.location.search
          );


        const requestedArea =
          params.get("area");


        if (
          requestedArea &&
          Object.prototype.hasOwnProperty.call(
            AREA_FILTERS,
            requestedArea
          )
        ) {

          activeArea =
            requestedArea;

        }


        activeTypes =
          params
            .getAll("type")
            .filter(
              type =>
                Object.prototype.hasOwnProperty.call(
                  EVENT_FILTERS,
                  type
                )
            );


        searchTerm =
          params.get("q") || "";


        searchInput.value =
          searchTerm;

      }


      function writeURLState() {

        const url =
          new URL(
            window.location.href
          );


        url.searchParams.delete(
          "area"
        );

        url.searchParams.delete(
          "type"
        );

        url.searchParams.delete(
          "q"
        );


        if (activeArea) {

          url.searchParams.set(
            "area",
            activeArea
          );

        }


        activeTypes.forEach(
          type => {

            url.searchParams.append(
              "type",
              type
            );

          }
        );


        if (searchTerm) {

          url.searchParams.set(
            "q",
            searchTerm
          );

        }


        history.replaceState(
          null,
          "",
          url
        );

      }


      /* ===================================================
         ACTIVE FILTER UI
         =================================================== */

      function activePrimaryButton() {

        if (!activeArea) {
          return allButton;
        }


        return (
          areaButtons.find(
            button =>
              button.dataset.area ===
              activeArea
          ) || allButton
        );

      }


      function moveIndicator(
        animate = true
      ) {

        const button =
          activePrimaryButton();


        if (!button) {
          return;
        }


        if (!animate) {

          indicator.style.transition =
            "none";

        }


        const barRect =
          filterBar.getBoundingClientRect();

        const buttonRect =
          button.getBoundingClientRect();


        const x =
          buttonRect.left -
          barRect.left +
          filterBar.scrollLeft;


        indicator.style.width =
          `${buttonRect.width}px`;

        indicator.style.transform =
          `translateX(${x}px)`;


        if (!animate) {

          requestAnimationFrame(
            () => {

              requestAnimationFrame(
                () => {

                  indicator.style.transition =
                    "";

                }
              );

            }
          );

        }

      }


      function updateFilterUI(
        animate = true
      ) {

        const allActive =
          activeArea === null;


        allButton.classList.toggle(
          "active",
          allActive
        );

        allButton.setAttribute(
          "aria-pressed",
          String(allActive)
        );


        areaButtons.forEach(
          button => {

            const active =
              button.dataset.area ===
              activeArea;


            button.classList.toggle(
              "active",
              active
            );

            button.setAttribute(
              "aria-pressed",
              String(active)
            );

          }
        );


        typeButtons.forEach(
          button => {

            const active =
              activeTypes.includes(
                button.dataset.type
              );


            button.classList.toggle(
              "active",
              active
            );

            button.setAttribute(
              "aria-pressed",
              String(active)
            );

          }
        );


        moreToggle.classList.toggle(
          "active",
          activeTypes.length > 0
        );


        /*
         * Clear filters sits in the top row immediately
         * after More. It only appears when a filter is
         * actually active.
         */

        clearFilters.hidden =
          activeArea === null &&
          activeTypes.length === 0;


        requestAnimationFrame(
          () =>
            moveIndicator(
              animate
            )
        );

      }


      /* ===================================================
         MORE PANEL
         =================================================== */

      function openMore() {

        morePanel.classList.add(
          "open"
        );

        morePanel.setAttribute(
          "aria-hidden",
          "false"
        );

        moreToggle.setAttribute(
          "aria-expanded",
          "true"
        );

      }


      function closeMore() {

        morePanel.classList.remove(
          "open"
        );

        morePanel.setAttribute(
          "aria-hidden",
          "true"
        );

        moreToggle.setAttribute(
          "aria-expanded",
          "false"
        );

      }


      moreToggle.addEventListener(
        "click",
        () => {

          if (
            morePanel.classList.contains(
              "open"
            )
          ) {

            closeMore();

          }
          else {

            openMore();

          }

        }
      );


      /* ===================================================
         LOCALIST URL
         =================================================== */

      function buildWidgetURL(
        containerID,
        area = null,
        type = null
      ) {

        const params =
          new URLSearchParams();


        params.set(
          "schools",
          "ncsu"
        );

        params.set(
          "groups",
          GROUP
        );

        params.set(
          "days",
          "365"
        );

        params.set(
          "num",
          "50"
        );


        /*
         * This is permanent.
         *
         * Every matching occurrence is always shown.
         */

        params.set(
          "all_instances",
          "1"
        );


        params.set(
          "experience",
          "inperson"
        );

        params.set(
          "container",
          containerID
        );

        params.set(
          "template",
          "widget-template-7"
        );


        const tags = [];


        if (
          area &&
          AREA_FILTERS[area]
        ) {

          tags.push(
            AREA_FILTERS[area]
          );

        }


        if (
          type &&
          EVENT_FILTERS[type]
        ) {

          tags.push(
            ...EVENT_FILTERS[type].tags
          );

        }


        if (tags.length) {

          params.set(
            "match",
            "all"
          );


          tags.forEach(
            tag => {

              params.append(
                "tags",
                tag
              );

            }
          );

        }


        return (
          WIDGET_BASE +
          "?" +
          params.toString()
        );

      }


      /* ===================================================
         LOCALIST LOADING
         =================================================== */

      function removeExistingScripts() {

        document
          .querySelectorAll(
            'script[data-dpat-localist="true"]'
          )
          .forEach(
            script =>
              script.remove()
          );

      }


      function loadLocalistWidget(
        area = null,
        type = null
      ) {

        return new Promise(
          resolve => {

            const loadID =
              "localist-widget-load-" +
              Date.now() +
              "-" +
              Math.random()
                .toString(36)
                .slice(2);


            const holder =
              document.createElement(
                "div"
              );


            holder.id =
              loadID;

            holder.className =
              "localist-widget";

            holder.style.position =
              "absolute";

            holder.style.left =
              "-99999px";

            holder.style.width =
              `${Math.max(
                widget.offsetWidth,
                900
              )}px`;


            document.body.appendChild(
              holder
            );


            const script =
              document.createElement(
                "script"
              );


            script.defer = true;

            script.dataset.dpatLocalist =
              "true";

            script.src =
              buildWidgetURL(
                loadID,
                area,
                type
              );


            document.body.appendChild(
              script
            );


            let checks = 0;


            const timer =
              window.setInterval(
                () => {

                  checks += 1;


                  const hasContent =
                    holder.children.length >
                    0;


                  if (
                    hasContent ||
                    checks >= 60
                  ) {

                    window.clearInterval(
                      timer
                    );


                    resolve(
                      holder
                    );

                  }

                },
                100
              );

          }
        );

      }


      /* ===================================================
         EVENT HELPERS
         =================================================== */

      function getEventItems(
        root
      ) {

        let items =
          [
            ...root.querySelectorAll(
              "li.lw_event_item"
            )
          ];


        if (items.length) {
          return items;
        }


        items =
          [
            ...root.querySelectorAll(
              "li"
            )
          ].filter(
            item =>
              item.querySelector(
                'a[href*="/event/"]'
              )
          );


        return items;

      }


      function eventKey(
        event
      ) {

        const link =
          event.querySelector(
            'a[href*="/event/"]'
          );


        if (link) {

          return (
            link.href +
            "|" +
            event.textContent
              .replace(/\s+/g, " ")
              .trim()
          );

        }


        return event.textContent
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();

      }


      function openEventLinksInNewTab(
        root
      ) {

        root
          .querySelectorAll(
            'a[href*="/event/"]'
          )
          .forEach(
            link => {

              link.target =
                "_blank";

              link.rel =
                "noopener noreferrer";

            }
          );

      }


      /* ===================================================
         SEARCH
         =================================================== */

      function applySearch() {

        const query =
          searchTerm
            .trim()
            .toLowerCase();


        const events =
          getEventItems(
            widget
          );


        if (!events.length) {

          if (query) {

            status.textContent =
              "0 events found";

          }
          else {

            status.textContent =
              "";

          }

          return;

        }


        let visibleCount = 0;


        events.forEach(
          event => {

            const text =
              event.textContent
                .toLowerCase();


            const visible =
              !query ||
              text.includes(
                query
              );


            event.style.display =
              visible
                ? ""
                : "none";


            if (visible) {

              visibleCount += 1;

            }

          }
        );


        if (query) {

          status.textContent =
            visibleCount === 1
              ? "1 event found"
              : `${visibleCount} events found`;

        }
        else {

          status.textContent =
            "";

        }

      }


      /* ===================================================
         RENDER
         =================================================== */

      async function renderCalendar() {

        const loadNumber =
          ++currentLoad;


        status.textContent =
          "";

        widget.innerHTML =
          "";


        removeExistingScripts();


        /*
         * No secondary type selected:
         * load Localist normally and preserve the exact
         * Localist-generated widget structure.
         */

        if (
          activeTypes.length === 0
        ) {

          const holder =
            await loadLocalistWidget(
              activeArea,
              null
            );


          if (
            loadNumber !==
            currentLoad
          ) {

            holder.remove();

            return;

          }


          while (
            holder.firstChild
          ) {

            widget.appendChild(
              holder.firstChild
            );

          }


          holder.remove();


          openEventLinksInNewTab(
            widget
          );

          applySearch();

          return;

        }


        /*
         * Multiple event types are OR selections.
         *
         * Each type is requested separately because
         * Localist's match=all behavior is used to keep
         * the selected area AND the selected event type
         * together.
         */

        const holders =
          await Promise.all(
            activeTypes.map(
              type =>
                loadLocalistWidget(
                  activeArea,
                  type
                )
            )
          );


        if (
          loadNumber !==
          currentLoad
        ) {

          holders.forEach(
            holder =>
              holder.remove()
          );

          return;

        }


        /*
         * Use the first returned Localist widget as the
         * structural template so its own generated classes
         * and layout remain intact.
         */

        const firstHolder =
          holders[0];


        while (
          firstHolder.firstChild
        ) {

          widget.appendChild(
            firstHolder.firstChild
          );

        }


        firstHolder.remove();


        /*
         * Find the actual Localist event list that already
         * exists in the rendered widget.
         */

        const targetEvents =
          getEventItems(
            widget
          );


        const targetList =
          targetEvents.length
            ? targetEvents[0].parentElement
            : null;


        const seen =
          new Set(
            targetEvents.map(
              event =>
                eventKey(
                  event
                )
            )
          );


        /*
         * Add only unique matching events from the other
         * Localist responses. We do NOT create a replacement
         * UL or rewrite Localist's outer widget structure.
         */

        holders
          .slice(1)
          .forEach(
            holder => {

              const events =
                getEventItems(
                  holder
                );


              if (targetList) {

                events.forEach(
                  event => {

                    const key =
                      eventKey(
                        event
                      );


                    if (
                      seen.has(
                        key
                      )
                    ) {

                      return;

                    }


                    seen.add(
                      key
                    );


                    targetList.appendChild(
                      event
                    );

                  }
                );

              }


              holder.remove();

            }
          );


        openEventLinksInNewTab(
          widget
        );

        applySearch();

      }


      /* ===================================================
         AREA FILTERS
         =================================================== */

      allButton.addEventListener(
        "click",
        () => {

          activeArea =
            null;


          updateFilterUI();

          writeURLState();

          renderCalendar();

        }
      );


      areaButtons.forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              activeArea =
                button.dataset.area;


              updateFilterUI();

              writeURLState();

              renderCalendar();

            }
          );

        }
      );


      /* ===================================================
         EVENT TYPE FILTERS
         =================================================== */

      typeButtons.forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              const type =
                button.dataset.type;


              if (
                activeTypes.includes(
                  type
                )
              ) {

                activeTypes =
                  activeTypes.filter(
                    current =>
                      current !== type
                  );

              }
              else {

                activeTypes.push(
                  type
                );

              }


              updateFilterUI();

              writeURLState();

              renderCalendar();

            }
          );

        }
      );


      /* ===================================================
         CLEAR FILTERS
         =================================================== */

      clearFilters.addEventListener(
        "click",
        () => {

          activeArea =
            null;

          activeTypes =
            [];


          updateFilterUI();

          writeURLState();

          renderCalendar();

        }
      );


      /* ===================================================
         SEARCH
         =================================================== */

      searchForm.addEventListener(
        "submit",
        event => {

          event.preventDefault();


          searchTerm =
            searchInput.value
              .trim();


          writeURLState();

          applySearch();

        }
      );


      searchInput.addEventListener(
        "input",
        () => {

          searchTerm =
            searchInput.value
              .trim();


          writeURLState();

          applySearch();

        }
      );


      /* ===================================================
         SHARE
         =================================================== */

      shareButton.addEventListener(
        "click",
        async () => {

          searchTerm =
            searchInput.value
              .trim();


          writeURLState();


          const url =
            window.location.href;


          try {

            if (
              navigator.share
            ) {

              await navigator.share(
                {
                  title:
                    "NC State Performing Arts and Technology Events",

                  url
                }
              );


              return;

            }


            if (
              navigator.clipboard
            ) {

              await navigator.clipboard
                .writeText(
                  url
                );


              const oldTitle =
                shareButton.title;


              shareButton.title =
                "Link copied";


              window.setTimeout(
                () => {

                  shareButton.title =
                    oldTitle;

                },
                1800
              );

            }

          }
          catch (error) {

            if (
              error &&
              error.name ===
              "AbortError"
            ) {

              return;

            }

          }

        }
      );


      /* ===================================================
         LOGO / BACK LINK
         =================================================== */

      backLink.addEventListener(
        "click",
        event => {

          event.preventDefault();


          /*
           * Do not hardcode the parent website because
           * DPAT may move beneath a different college.
           */

          if (
            document.referrer
          ) {

            try {

              const previous =
                new URL(
                  document.referrer
                );


              const current =
                new URL(
                  window.location.href
                );


              if (
                previous.href !==
                current.href
              ) {

                window.location.href =
                  previous.href;

                return;

              }

            }
            catch (error) {
              /* Fall through */
            }

          }


          if (
            window.history.length >
            1
          ) {

            window.history.back();

          }

        }
      );


      /* ===================================================
         POSITIONING
         =================================================== */

      filterBar.addEventListener(
        "scroll",
        () =>
          moveIndicator(
            false
          ),
        {
          passive: true
        }
      );


      window.addEventListener(
        "resize",
        () =>
          moveIndicator(
            false
          )
      );


      /* ===================================================
         INITIALIZE
         =================================================== */

      readURLState();

      updateFilterUI(
        false
      );


      if (
        activeTypes.length
      ) {

        openMore();

      }


      renderCalendar();

    })();
  </script>

</body>
