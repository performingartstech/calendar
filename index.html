<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Events | Performing Arts and Technology</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
    }

    body {
      font-family: "Roboto", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    button,
    input {
      font: inherit;
    }


    /* ACCESSIBILITY */

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }


    /* BRAND HEADER */

    .brand-header {
      width: 100%;
      background: #cc0000;
    }

    .brand-header-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0px 10px;
    }

    .brand-header-logo {
      display: block;
      width: min(100%, 400px);
      height: auto;
    }


    /* PAGE */

    .calendar-page {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 22px 24px 48px;
    }


    /* FILTER / SEARCH TOOLBAR */

    #calendar-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;

      gap: 10px 20px;

      width: 100%;

      margin: 0 0 22px;
      padding: 0 0 14px;

      border-bottom: 1px solid #ccc;
    }


    /* COMPACT SEARCH */

    #calendar-search-form {
      display: flex;
      flex: 0 1 300px;

      width: 300px;
      max-width: 100%;

      margin: 0 8px 0 0;
    }

    #calendar-search {
      flex: 1 1 auto;

      width: 100%;
      min-width: 0;
      height: 38px;

      margin: 0;
      padding: 0 12px;

      border: 1px solid #000;
      border-right: 0;
      border-radius: 0;

      background: #fff;
      color: #000;

      font-size: 15px;

      appearance: none;
      -webkit-appearance: none;
    }

    #calendar-search::placeholder {
      color: #666;
      opacity: 1;
    }

    #calendar-search-form > button {
      display: flex;
      flex: 0 0 38px;

      align-items: center;
      justify-content: center;

      width: 38px;
      height: 38px;

      margin: 0;
      padding: 0;

      border: 1px solid #cc0000;
      border-radius: 0;

      background: #cc0000;
      color: #fff;

      cursor: pointer;
    }

    #calendar-search-form > button:hover {
      background: #990000;
      border-color: #990000;
    }

    #calendar-search:focus,
    #calendar-search-form > button:focus {
      outline: none;
    }

    #calendar-search-form .material-symbols-sharp {
      font-size: 21px;
    }


    /* FILTER BUTTONS */

    #calendar-filters button {
      appearance: none;
      -webkit-appearance: none;

      margin: 0;
      padding: 3px 0;

      border: 0;
      border-radius: 0;

      background: transparent;
      color: #333;

      font-size: 15px;
      font-weight: 500;

      cursor: pointer;
      white-space: nowrap;
    }

    #calendar-filters button:hover {
      color: #cc0000;
    }

    #calendar-filters button.active {
      color: #cc0000;
    }

    #calendar-filters button.active:not(#more-button) {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 5px;
    }

    #calendar-filters button:focus-visible {
      outline: 2px solid #000;
      outline-offset: 3px;
    }

    /*
     * Restore the red search button because
     * the generic filter-button rule above
     * also applies to it.
     */

    #calendar-filters #calendar-search-form > button {
      display: flex;

      flex: 0 0 38px;

      align-items: center;
      justify-content: center;

      width: 38px;
      height: 38px;

      margin: 0;
      padding: 0;

      border: 1px solid #cc0000;

      background: #cc0000;
      color: #fff;
    }

    #calendar-filters #calendar-search-form > button:hover {
      background: #990000;
      border-color: #990000;
      color: #fff;
    }


    /* MORE */

    #more-wrap {
      position: relative;
      display: inline-block;
    }

    #more-button {
      position: relative;

      display: inline-flex;
      align-items: center;

      gap: 3px;

      text-decoration: none;
    }

    #more-button.active {
      color: #cc0000;
      text-decoration: none;
    }

    /*
     * Underline only the word More,
     * not the caret.
     */

    #more-button.active::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: -2px;

      width: calc(100% - 25px);
      height: 2px;

      background: #cc0000;
    }

    #more-button .material-symbols-sharp {
      flex: 0 0 auto;

      font-size: 19px;

      text-decoration: none;
    }

    #more-button[aria-expanded="true"] .material-symbols-sharp {
      transform: rotate(180deg);
    }


    /* MORE MENU */

    #more-menu {
      position: absolute;
      z-index: 1000;

      top: calc(100% + 9px);
      left: 0;

      min-width: 220px;

      margin: 0;
      padding: 6px 0;

      border: 1px solid #aaa;

      background: #fff;

      box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
    }

    #more-menu[hidden] {
      display: none;
    }

    #more-menu button {
      display: block;

      width: 100%;

      margin: 0;
      padding: 9px 12px;

      text-align: left;

      color: #333;

      font-weight: 400;
      text-decoration: none;
    }

    #more-menu button:hover {
      background: #f2f2f2;
    }

    #more-menu button.active {
      background: #f2f2f2;
      color: #cc0000;

      text-decoration: none;
    }


    /* COPY URL */

    #copy-url {
      margin-left: auto !important;

      color: #555 !important;

      font-weight: 400 !important;
      text-decoration: none !important;
    }

    #copy-url:hover {
      color: #cc0000 !important;
    }


    /* STATUS */

    #calendar-status {
      margin: -10px 0 18px;

      color: #555;

      font-size: 14px;
    }

    #calendar-status:empty {
      display: none;
    }


    /* LOCALIST */

    #localist-widget-dpat {
      width: 100%;
      margin: 0;
      padding: 0;
    }


    /* MOBILE */

    @media (max-width: 700px) {

      .brand-header-inner {
        padding: 10px 16px;
      }

      .brand-header-logo {
        width: min(100%, 350px);
      }

      .calendar-page {
        padding: 18px 16px 36px;
      }

      #calendar-filters {
        gap: 10px 17px;
      }

      /*
       * Search gets its own full-width row
       * on smaller screens.
       */

      #calendar-search-form {
        flex: 1 0 100%;

        width: 100%;
        max-width: 100%;

        margin: 0;
      }

      #copy-url {
        margin-left: 0 !important;
      }

    }

  </style>
</head>


<body>


<header class="brand-header">

  <div class="brand-header-inner">

    <img
      src="D_pat_identifier_RGB_mono_white.svg"
      alt="NC State Department of Performing Arts and Technology"
      class="brand-header-logo"
    >

  </div>

</header>


<main class="calendar-page">


  <!-- SEARCH + FILTER TOOLBAR -->

  <div
    id="calendar-filters"
    aria-label="Search and filter events"
  >


    <!-- SEARCH -->

    <form
      id="calendar-search-form"
      role="search"
    >

      <label
        class="sr-only"
        for="calendar-search"
      >
        Search events
      </label>

      <input
        id="calendar-search"
        type="search"
        placeholder="Search events"
        autocomplete="off"
      >

      <button
        type="submit"
        aria-label="Search events"
      >

        <span
          class="material-symbols-sharp"
          aria-hidden="true"
        >
          search
        </span>

      </button>

    </form>


    <!-- ALL -->

    <button
      type="button"
      id="filter-all"
      class="active"
    >
      All
    </button>


    <!-- AREAS -->

    <button
      type="button"
      data-area="music"
    >
      Music
    </button>

    <button
      type="button"
      data-area="dance"
    >
      Dance
    </button>

    <button
      type="button"
      data-area="arts"
    >
      Arts Entrepreneurship
    </button>

    <button
      type="button"
      data-area="tech"
    >
      Music Technology
    </button>


    <!-- MORE -->

    <span id="more-wrap">

      <button
        type="button"
        id="more-button"
        aria-expanded="false"
        aria-controls="more-menu"
      >
        More

        <span
          class="material-symbols-sharp"
          aria-hidden="true"
        >
          expand_more
        </span>

      </button>


      <span
        id="more-menu"
        hidden
      >

        <button
          type="button"
          data-event-type="performance"
        >
          Performances
        </button>

        <button
          type="button"
          data-event-type="masterclass"
        >
          Master Classes
        </button>

        <button
          type="button"
          data-event-type="audition"
        >
          Auditions
        </button>

        <button
          type="button"
          data-event-type="workshop"
        >
          Workshops &amp; Talks
        </button>

      </span>

    </span>


    <!-- COPY -->

    <button
      type="button"
      id="copy-url"
      title="Copy a link to the current filters"
    >
      Copy URL
    </button>

  </div>


  <!-- SEARCH STATUS -->

  <div
    id="calendar-status"
    aria-live="polite"
  ></div>


  <!-- LOCALIST -->

  <div
    id="localist-widget-dpat"
    class="localist-widget"
  ></div>


</main>


<script>

(function () {


  /* =====================================================
     CONFIG
     ===================================================== */

  const BASE =
    "https://calendar.ncsu.edu/widget/view";


  const AREAS = {

    music: {
      tags: ["music"]
    },

    dance: {
      types: ["6673"]
    },

    arts: {
      tags: ["arts entrepreneurship"]
    },

    tech: {
      tags: ["music technology"]
    }

  };


  const EVENT_TYPES = {

    performance: {
      tags: ["performance"]
    },

    masterclass: {
      tags: ["Master Class Series"]
    },

    audition: {
      tags: ["audition"]
    },

    workshop: {
      tags: ["workshop"]
    }

  };


  /* =====================================================
     CASE-INSENSITIVE HELPERS
     ===================================================== */

  function normalize(value) {

    return String(value || "")
      .trim()
      .toLocaleLowerCase();

  }


  function equalsIgnoreCase(a, b) {

    return normalize(a) ===
      normalize(b);

  }


  function includesIgnoreCase(text, search) {

    return normalize(text)
      .includes(
        normalize(search)
      );

  }


  function uniqueIgnoreCase(values) {

    const found =
      new Map();


    values.forEach(
      value => {

        const key =
          normalize(value);


        if (
          key &&
          !found.has(key)
        ) {

          /*
           * Preserve original capitalization
           * when sending the tag to Localist.
           */

          found.set(
            key,
            value
          );

        }

      }
    );


    return Array.from(
      found.values()
    );

  }


  /* =====================================================
     ELEMENTS
     ===================================================== */

  const container =
    document.getElementById(
      "localist-widget-dpat"
    );


  const allButton =
    document.getElementById(
      "filter-all"
    );


  const areaButtons =
    Array.from(
      document.querySelectorAll(
        "[data-area]"
      )
    );


  const eventButtons =
    Array.from(
      document.querySelectorAll(
        "[data-event-type]"
      )
    );


  const moreWrap =
    document.getElementById(
      "more-wrap"
    );


  const moreButton =
    document.getElementById(
      "more-button"
    );


  const moreMenu =
    document.getElementById(
      "more-menu"
    );


  const copyButton =
    document.getElementById(
      "copy-url"
    );


  const searchForm =
    document.getElementById(
      "calendar-search-form"
    );


  const searchInput =
    document.getElementById(
      "calendar-search"
    );


  const status =
    document.getElementById(
      "calendar-status"
    );


  /* =====================================================
     STATE
     ===================================================== */

  let activeArea =
    null;


  let activeEventType =
    null;


  let searchQuery =
    "";


  /* =====================================================
     FIND CONFIG KEY CASE-INSENSITIVELY
     ===================================================== */

  function findConfigKey(
    value,
    config
  ) {

    if (!value) {
      return null;
    }


    return (
      Object.keys(config)
        .find(
          key =>
            equalsIgnoreCase(
              key,
              value
            )
        ) || null
    );

  }


  /* =====================================================
     READ URL
     ===================================================== */

  function readURL() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    activeArea =
      findConfigKey(
        params.get("area"),
        AREAS
      );


    activeEventType =
      findConfigKey(
        params.get("type"),
        EVENT_TYPES
      );


    searchQuery =
      params.get("q") || "";


    searchInput.value =
      searchQuery;

  }


  /* =====================================================
     UPDATE URL
     ===================================================== */

  function updateURL() {

    const url =
      new URL(
        window.location.href
      );


    url.searchParams.delete(
      "area"
    );


    url.searchParams.delete(
      "type"
    );


    url.searchParams.delete(
      "q"
    );


    if (activeArea) {

      url.searchParams.set(
        "area",
        activeArea
      );

    }


    if (activeEventType) {

      url.searchParams.set(
        "type",
        activeEventType
      );

    }


    if (searchQuery) {

      url.searchParams.set(
        "q",
        searchQuery
      );

    }


    history.replaceState(
      null,
      "",
      url
    );

  }


  /* =====================================================
     UPDATE CONTROLS
     ===================================================== */

  function updateControls() {

    areaButtons.forEach(
      button => {

        button.classList.toggle(
          "active",
          equalsIgnoreCase(
            button.dataset.area,
            activeArea
          )
        );

      }
    );


    eventButtons.forEach(
      button => {

        button.classList.toggle(
          "active",
          equalsIgnoreCase(
            button.dataset.eventType,
            activeEventType
          )
        );

      }
    );


    moreButton.classList.toggle(
      "active",
      !!activeEventType
    );


    allButton.classList.toggle(
      "active",
      !activeArea &&
      !activeEventType
    );

  }


  /* =====================================================
     BUILD LOCALIST URL
     ===================================================== */

  function buildWidgetURL() {

    const params =
      new URLSearchParams();


    params.set(
      "schools",
      "ncsu"
    );


    params.set(
      "groups",
      "department_of_performing_arts_and_technology"
    );


    params.set(
      "days",
      "365"
    );


    params.set(
      "num",
      "50"
    );


    /*
     * This is the matching parameter generated
     * by the NC State Localist widget builder.
     */

    params.set(
      "match",
      "all"
    );


    params.set(
      "experience",
      "inperson"
    );


    params.set(
      "container",
      "localist-widget-dpat"
    );


    params.set(
      "template",
      "widget-template-7"
    );


    let types =
      [];


    let tags =
      [];


    /* AREA */

    if (activeArea) {

      const area =
        AREAS[
          activeArea
        ];


      if (
        area &&
        area.types
      ) {

        types.push(
          ...area.types
        );

      }


      if (
        area &&
        area.tags
      ) {

        tags.push(
          ...area.tags
        );

      }

    }


    /* EVENT TYPE */

    if (activeEventType) {

      const eventType =
        EVENT_TYPES[
          activeEventType
        ];


      if (
        eventType &&
        eventType.types
      ) {

        types.push(
          ...eventType.types
        );

      }


      if (
        eventType &&
        eventType.tags
      ) {

        tags.push(
          ...eventType.tags
        );

      }

    }


    types =
      Array.from(
        new Set(types)
      );


    tags =
      uniqueIgnoreCase(
        tags
      );


    if (
      types.length
    ) {

      params.set(
        "types",
        types.join(",")
      );

    }


    if (
      tags.length
    ) {

      params.set(
        "tags",
        tags.join(",")
      );

    }


    return (
      BASE +
      "?" +
      params.toString()
    );

  }


  /* =====================================================
     LOAD LOCALIST
     ===================================================== */

  function loadWidget() {

    status.textContent =
      "";


    /*
     * Remove the previously injected
     * Localist widget script.
     */

    document
      .querySelectorAll(
        "script[data-dpat-widget]"
      )
      .forEach(
        script =>
          script.remove()
      );


    /*
     * Clear old Localist output.
     */

    container.innerHTML =
      "";


    /*
     * Inject the new widget.
     */

    const script =
      document.createElement(
        "script"
      );


    script.type =
      "text/javascript";


    script.defer =
      true;


    script.setAttribute(
      "data-dpat-widget",
      "true"
    );


    script.src =
      buildWidgetURL();


    container.parentNode.insertBefore(
      script,
      container.nextSibling
    );


    /*
     * Search again after Localist has
     * had time to render.
     */

    setTimeout(
      applySearch,
      700
    );


    setTimeout(
      applySearch,
      1400
    );


    setTimeout(
      applySearch,
      2500
    );

  }


  /* =====================================================
     AREA FILTERS
     ===================================================== */

  areaButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        function () {

          const value =
            button.dataset.area;


          if (
            equalsIgnoreCase(
              activeArea,
              value
            )
          ) {

            activeArea =
              null;

          }

          else {

            activeArea =
              findConfigKey(
                value,
                AREAS
              );

          }


          updateControls();

          updateURL();

          loadWidget();

        }
      );

    }
  );


  /* =====================================================
     EVENT TYPE FILTERS
     ===================================================== */

  eventButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        function () {

          const value =
            button.dataset.eventType;


          if (
            equalsIgnoreCase(
              activeEventType,
              value
            )
          ) {

            activeEventType =
              null;

          }

          else {

            activeEventType =
              findConfigKey(
                value,
                EVENT_TYPES
              );

          }


          moreMenu.hidden =
            true;


          moreButton.setAttribute(
            "aria-expanded",
            "false"
          );


          updateControls();

          updateURL();

          loadWidget();

        }
      );

    }
  );


  /* =====================================================
     ALL
     ===================================================== */

  allButton.addEventListener(
    "click",
    function () {

      activeArea =
        null;


      activeEventType =
        null;


      updateControls();

      updateURL();

      loadWidget();

    }
  );


  /* =====================================================
     MORE MENU
     ===================================================== */

  moreButton.addEventListener(
    "click",
    function () {

      const opening =
        moreMenu.hidden;


      moreMenu.hidden =
        !opening;


      moreButton.setAttribute(
        "aria-expanded",
        opening
          ? "true"
          : "false"
      );

    }
  );


  document.addEventListener(
    "click",
    function (event) {

      if (
        !moreWrap.contains(
          event.target
        )
      ) {

        moreMenu.hidden =
          true;


        moreButton.setAttribute(
          "aria-expanded",
          "false"
        );

      }

    }
  );


  /* =====================================================
     FIND EVENT ITEMS
     ===================================================== */

  function getEventItems() {

    const standardItems =
      Array.from(
        container.querySelectorAll(
          "li.lw_event_item"
        )
      );


    if (
      standardItems.length
    ) {

      return standardItems;

    }


    return Array.from(
      container.querySelectorAll(
        "li"
      )
    ).filter(
      item =>
        item.querySelector(
          'a[href*="/event/"]'
        )
    );

  }


  /* =====================================================
     CASE-INSENSITIVE SEARCH
     ===================================================== */

  function applySearch() {

    const query =
      normalize(
        searchQuery
      );


    const events =
      getEventItems();


    if (
      !events.length
    ) {

      return;

    }


    let visible =
      0;


    events.forEach(
      event => {

        const matches =
          !query ||
          includesIgnoreCase(
            event.textContent,
            query
          );


        event.style.display =
          matches
            ? ""
            : "none";


        if (
          matches
        ) {

          visible++;

        }

      }
    );


    if (
      query
    ) {

      status.textContent =
        visible === 1
          ? "1 event found"
          : visible +
            " events found";

    }

    else {

      status.textContent =
        "";

    }

  }


  /* =====================================================
     SEARCH
     ===================================================== */

  searchForm.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();


      searchQuery =
        searchInput
          .value
          .trim();


      updateURL();

      applySearch();

    }
  );


  searchInput.addEventListener(
    "input",
    function () {

      if (
        searchInput.value === ""
      ) {

        searchQuery =
          "";


        updateURL();

        applySearch();

      }

    }
  );


  /* =====================================================
     COPY URL
     ===================================================== */

  copyButton.addEventListener(
    "click",
    async function () {

      searchQuery =
        searchInput
          .value
          .trim();


      updateURL();


      try {

        await navigator
          .clipboard
          .writeText(
            window.location.href
          );

      }

      catch (error) {

        const field =
          document.createElement(
            "textarea"
          );


        field.value =
          window.location.href;


        field.style.position =
          "fixed";


        field.style.opacity =
          "0";


        document.body.appendChild(
          field
        );


        field.select();


        document.execCommand(
          "copy"
        );


        field.remove();

      }


      copyButton.textContent =
        "Copied!";


      setTimeout(
        function () {

          copyButton.textContent =
            "Copy URL";

        },
        1500
      );

    }
  );


  /* =====================================================
