<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Events | Performing Arts and Technology</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,400,0,0"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
    }

    body {
      font-family: "Roboto", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    button,
    input {
      font: inherit;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .calendar-page {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 48px;
    }

    /* SEARCH */

    #calendar-search-form {
      display: flex;
      width: 100%;
      margin: 0 0 16px;
    }

    #calendar-search {
      flex: 1 1 auto;
      min-width: 0;
      height: 54px;
      padding: 0 16px;

      border: 1px solid #000;
      border-right: 0;
      border-radius: 0;

      background: #fff;
      color: #000;

      font-size: 18px;

      appearance: none;
      -webkit-appearance: none;
    }

    #calendar-search::placeholder {
      color: #666;
      opacity: 1;
    }

    #calendar-search-form > button {
      flex: 0 0 54px;
      width: 54px;
      height: 54px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;

      border: 1px solid #cc0000;
      border-radius: 0;

      background: #cc0000;
      color: #fff;

      cursor: pointer;
    }

    #calendar-search-form > button:hover {
      background: #990000;
      border-color: #990000;
    }

    #calendar-search-form:focus-within {
      outline: 3px solid #6f7d1c;
      outline-offset: 3px;
    }

    #calendar-search:focus,
    #calendar-search-form > button:focus {
      outline: none;
    }

    .material-symbols-sharp {
      font-size: 26px;

      font-variation-settings:
        "FILL" 0,
        "wght" 400,
        "GRAD" 0,
        "opsz" 24;
    }

    /* FILTER BAR */

    #calendar-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;

      gap: 9px 22px;

      width: 100%;

      margin: 0 0 22px;
      padding: 0 0 14px;

      border-bottom: 1px solid #ccc;
    }

    #calendar-filters button {
      appearance: none;
      -webkit-appearance: none;

      margin: 0;
      padding: 3px 0;

      border: 0;
      border-radius: 0;

      background: transparent;
      color: #333;

      font-size: 15px;
      font-weight: 500;

      cursor: pointer;
      white-space: nowrap;
    }

    #calendar-filters button:hover {
      color: #cc0000;
    }

    #calendar-filters button.active {
      color: #cc0000;

      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 5px;
    }

    #calendar-filters button:focus-visible {
      outline: 3px solid #6f7d1c;
      outline-offset: 3px;
    }

    /* MORE */

    #more-wrap {
      position: relative;
      display: inline-block;
    }

    #more-button {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    #more-button .material-symbols-sharp {
      font-size: 19px;
    }

    #more-button[aria-expanded="true"] .material-symbols-sharp {
      transform: rotate(180deg);
    }

    #more-menu {
      position: absolute;
      z-index: 1000;

      top: calc(100% + 9px);
      left: 0;

      min-width: 220px;

      padding: 6px 0;

      border: 1px solid #aaa;

      background: #fff;

      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }

    #more-menu[hidden] {
      display: none;
    }

    #more-menu button {
      display: block;

      width: 100%;

      padding: 9px 12px;

      text-align: left;

      color: #333;

      font-weight: 400;
    }

    #more-menu button:hover {
      background: #f2f2f2;
    }

    #more-menu button.active {
      background: #f2f2f2;
      color: #cc0000;

      text-decoration: none;
    }

    /* COPY */

    #copy-url {
      margin-left: auto !important;
      color: #555 !important;
      font-weight: 400 !important;
    }

    #copy-url:hover {
      color: #cc0000 !important;
    }

    /* LOCALIST */

    #localist-widget-dpat {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    @media (max-width: 700px) {
      .calendar-page {
        padding: 20px 16px 36px;
      }

      #calendar-search,
      #calendar-search-form > button {
        height: 50px;
      }

      #calendar-search {
        font-size: 16px;
      }

      #calendar-search-form > button {
        width: 50px;
        flex-basis: 50px;
      }

      #calendar-filters {
        gap: 10px 17px;
      }

      #copy-url {
        margin-left: 0 !important;
      }
    }
  </style>
</head>

<body>

<main class="calendar-page">

  <!-- SEARCH -->

  <form id="calendar-search-form" role="search">

    <label class="sr-only" for="calendar-search">
      Search events
    </label>

    <input
      id="calendar-search"
      type="search"
      placeholder="Search"
      autocomplete="off"
    >

    <button type="submit" aria-label="Search events">
      <span class="material-symbols-sharp" aria-hidden="true">
        search
      </span>
    </button>

  </form>


  <!-- FILTERS -->

  <div id="calendar-filters">

    <button
      type="button"
      id="filter-all"
      class="active"
    >
      All
    </button>

    <button type="button" data-area="music">
      Music
    </button>

    <button type="button" data-area="dance">
      Dance
    </button>

    <button type="button" data-area="arts">
      Arts Entrepreneurship
    </button>

    <button type="button" data-area="tech">
      Music Technology
    </button>


    <span id="more-wrap">

      <button
        type="button"
        id="more-button"
        aria-expanded="false"
      >
        More

        <span class="material-symbols-sharp" aria-hidden="true">
          expand_more
        </span>
      </button>


      <span id="more-menu" hidden>

        <button type="button" data-event-type="performance">
          Performances
        </button>

        <button type="button" data-event-type="masterclass">
          Master Classes
        </button>

        <button type="button" data-event-type="audition">
          Auditions
        </button>

        <button type="button" data-event-type="workshop">
          Workshops &amp; Talks
        </button>

      </span>

    </span>


    <button
      type="button"
      id="copy-url"
    >
      Copy URL
    </button>

  </div>


  <!-- LOCALIST -->

  <div
    id="localist-widget-dpat"
    class="localist-widget"
  ></div>

</main>


<script>
(function () {

  /* =====================================================
     CONFIG
     ===================================================== */

  const BASE =
    "https://calendar.ncsu.edu/widget/view";


  /*
   * AREA CLASSIFICATIONS
   *
   * Dance is a confirmed Localist filter item.
   *
   * The others are currently using their Localist tags.
   */

  const AREAS = {

    music: {
      tags: ["music"]
    },

    dance: {
      types: ["6673"]
    },

    arts: {
      tags: ["arts entrepreneurship"]
    },

    tech: {
      tags: ["music technology"]
    }

  };


  /*
   * EVENT CLASSIFICATIONS
   *
   * Master Class Series is a confirmed Localist
   * filter item.
   */

  const EVENT_TYPES = {

    performance: {
      tags: ["performance"]
    },

    masterclass: {
      types: ["43598230166255"]
    },

    audition: {
      tags: ["audition"]
    },

    workshop: {
      tags: ["workshop"]
    }

  };


  /* =====================================================
     ELEMENTS
     ===================================================== */

  const container =
    document.getElementById(
      "localist-widget-dpat"
    );

  const allButton =
    document.getElementById(
      "filter-all"
    );

  const areaButtons =
    Array.from(
      document.querySelectorAll(
        "[data-area]"
      )
    );

  const eventButtons =
    Array.from(
      document.querySelectorAll(
        "[data-event-type]"
      )
    );

  const moreWrap =
    document.getElementById(
      "more-wrap"
    );

  const moreButton =
    document.getElementById(
      "more-button"
    );

  const moreMenu =
    document.getElementById(
      "more-menu"
    );

  const copyButton =
    document.getElementById(
      "copy-url"
    );

  const searchForm =
    document.getElementById(
      "calendar-search-form"
    );

  const searchInput =
    document.getElementById(
      "calendar-search"
    );


  /* =====================================================
     STATE
     ===================================================== */

  let activeArea = null;

  let activeEventType = null;

  let searchQuery = "";


  /* =====================================================
     URL STATE
     ===================================================== */

  function readURL() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const area =
      params.get("area");


    const type =
      params.get("type");


    if (area && AREAS[area]) {
      activeArea = area;
    }


    if (type && EVENT_TYPES[type]) {
      activeEventType = type;
    }


    searchQuery =
      params.get("q") || "";


    searchInput.value =
      searchQuery;

  }


  function updateURL() {

    const url =
      new URL(
        window.location.href
      );


    url.searchParams.delete("area");
    url.searchParams.delete("type");
    url.searchParams.delete("q");


    if (activeArea) {
      url.searchParams.set(
        "area",
        activeArea
      );
    }


    if (activeEventType) {
      url.searchParams.set(
        "type",
        activeEventType
      );
    }


    if (searchQuery) {
      url.searchParams.set(
        "q",
        searchQuery
      );
    }


    history.replaceState(
      null,
      "",
      url
    );

  }


  /* =====================================================
     UI STATE
     ===================================================== */

  function updateControls() {

    areaButtons.forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.area === activeArea
        );

      }
    );


    eventButtons.forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.eventType ===
            activeEventType
        );

      }
    );


    moreButton.classList.toggle(
      "active",
      !!activeEventType
    );


    allButton.classList.toggle(
      "active",
      !activeArea &&
      !activeEventType
    );

  }


  /* =====================================================
     BUILD LOCALIST QUERY
     ===================================================== */

  function buildWidgetURL() {

    const params =
      new URLSearchParams();


    params.set(
      "schools",
      "ncsu"
    );


    params.set(
      "groups",
      "department_of_performing_arts_and_technology"
    );


    params.set(
      "days",
      "365"
    );


    params.set(
      "num",
      "50"
    );


    params.set(
      "experience",
      "inperson"
    );


    params.set(
      "container",
      "localist-widget-dpat"
    );


    params.set(
      "template",
      "widget-template-7"
    );


    let types = [];
    let tags = [];


    /*
     * AREA
     */

    if (activeArea) {

      const area =
        AREAS[activeArea];


      if (area.types) {
        types.push(
          ...area.types
        );
      }


      if (area.tags) {
        tags.push(
          ...area.tags
        );
      }

    }


    /*
     * EVENT TYPE
     */

    if (activeEventType) {

      const eventType =
        EVENT_TYPES[
          activeEventType
        ];


      if (eventType.types) {
        types.push(
          ...eventType.types
        );
      }


      if (eventType.tags) {
        tags.push(
          ...eventType.tags
        );
      }

    }


    if (types.length) {

      params.set(
        "types",
        types.join(",")
      );

    }


    if (tags.length) {

      params.set(
        "tags",
        tags.join(",")
      );

    }


    /*
     * THIS IS THE IMPORTANT PART.
     *
     * Your Localist builder screenshot tells us that
     * Localist has a mode requiring:
     *
     * - at least one place/group/keyword/tag
     * - AND one filter item
     *
     * The widget parameter corresponding to the stricter
     * matching behavior is match_all.
     *
     * We only turn it on when two different
     * classifications are actually being combined.
     */

    if (
      activeArea &&
      activeEventType
    ) {

      params.set(
        "match_all",
        "true"
      );

    }


    return (
      BASE +
      "?" +
      params.toString()
    );

  }


  /* =====================================================
     LOAD LOCALIST
     ===================================================== */

  function loadWidget() {

    document
      .querySelectorAll(
        "script[data-dpat-widget]"
      )
      .forEach(
        script => script.remove()
      );


    container.innerHTML = "";


    const script =
      document.createElement(
        "script"
      );


    script.defer = true;


    script.setAttribute(
      "data-dpat-widget",
      "true"
    );


    script.src =
      buildWidgetURL();


    container.parentNode.insertBefore(
      script,
      container.nextSibling
    );


    setTimeout(
      applySearch,
      1000
    );


    setTimeout(
      applySearch,
      2000
    );

  }


  /* =====================================================
     AREA BUTTONS
     ===================================================== */

  areaButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        function () {

          const value =
            button.dataset.area;


          if (activeArea === value) {

            activeArea = null;

          } else {

            activeArea = value;

          }


          updateControls();

          updateURL();

          loadWidget();

        }
      );

    }
  );


  /* =====================================================
     EVENT TYPE BUTTONS
     ===================================================== */

  eventButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        function () {

          const value =
            button.dataset.eventType;


          if (
            activeEventType === value
          ) {

            activeEventType = null;

          } else {

            activeEventType = value;

          }


          moreMenu.hidden = true;


          moreButton.setAttribute(
            "aria-expanded",
            "false"
          );


          updateControls();

          updateURL();

          loadWidget();

        }
      );

    }
  );


  /* =====================================================
     ALL
     ===================================================== */

  allButton.addEventListener(
    "click",
    function () {

      activeArea = null;

      activeEventType = null;


      updateControls();

      updateURL();

      loadWidget();

    }
  );


  /* =====================================================
     MORE
     ===================================================== */

  moreButton.addEventListener(
    "click",
    function () {

      const opening =
        moreMenu.hidden;


      moreMenu.hidden =
        !opening;


      moreButton.setAttribute(
        "aria-expanded",
        opening
          ? "true"
          : "false"
      );

    }
  );


  document.addEventListener(
    "click",
    function (event) {

      if (
        !moreWrap.contains(
          event.target
        )
      ) {

        moreMenu.hidden = true;


        moreButton.setAttribute(
          "aria-expanded",
          "false"
        );

      }

    }
  );


  /* =====================================================
     SEARCH
     ===================================================== */

  function getEventItems() {

    const obvious =
      Array.from(
        container.querySelectorAll(
          "li.lw_event_item"
        )
      );


    if (obvious.length) {
      return obvious;
    }


    return Array.from(
      container.querySelectorAll(
        "li"
      )
    ).filter(
      item =>
        item.querySelector(
          'a[href*="/event/"]'
        )
    );

  }


  function applySearch() {

    const query =
      searchQuery
        .trim()
        .toLowerCase();


    const events =
      getEventItems();


    events.forEach(
      event => {

        const text =
          event.textContent
            .toLowerCase()
            .replace(
              /\s+/g,
              " "
            );


        event.style.display =
          !query ||
          text.includes(query)
            ? ""
            : "none";

      }
    );

  }


  searchForm.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();


      searchQuery =
        searchInput.value.trim();


      updateURL();

      applySearch();

    }
  );


  searchInput.addEventListener(
    "input",
    function () {

      if (
        searchInput.value === ""
      ) {

        searchQuery = "";


        updateURL();

        applySearch();

      }

    }
  );


  /* =====================================================
     COPY URL
     ===================================================== */

  copyButton.addEventListener(
    "click",
    async function () {

      searchQuery =
        searchInput.value.trim();


      updateURL();


      try {

        await navigator
          .clipboard
          .writeText(
            window.location.href
          );

      } catch (error) {

        const field =
          document.createElement(
            "textarea"
          );


        field.value =
          window.location.href;


        document.body.appendChild(
          field
        );


        field.select();


        document.execCommand(
          "copy"
        );


        field.remove();

      }


      copyButton.textContent =
        "Copied!";


      setTimeout(
        function () {

          copyButton.textContent =
            "Copy URL";

        },
        1500
      );

    }
  );


  /* =====================================================
     START
     ===================================================== */

  readURL();

  updateControls();

  loadWidget();


})();
</script>

</body>
</html>
