<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Events | Performing Arts and Technology</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --brand-primary: #cc0000;
      --brand-primary-dark: #990000;
      --brand-primary-extra-dark: #5e0000;

      --white: #ffffff;
      --black: #000000;

      --very-light-gray: #f2f2f2;
      --light-gray: #cccccc;
      --mid-gray: #666666;
      --dark-gray: #333333;
      --gray-100: #e5e5e5;
      --gray-300: #b2b2b2;

      --max-width: 1200px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--white);
      color: var(--black);
    }

    body {
      font-family: "Roboto", Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }


    /* Header */

    .brand-header {
      width: 100%;
      background: var(--brand-primary);
    }

    .brand-header-inner {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 10px;
    }

    .brand-header-logo {
      display: block;
      width: min(100%, 400px);
      height: auto;
    }


    /* Page */

    .calendar-page {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 24px 24px 48px;
    }


    /* Toolbar */

    #calendar-filters {
      display: flex;
      align-items: center;
      gap: 22px;

      width: 100%;
      margin: 0 0 18px;
    }


    /* Search */

    #calendar-search-form {
      display: flex;
      flex: 0 0 300px;

      width: 300px;
      height: 42px;
      margin: 0;
    }

    #calendar-search {
      flex: 1 1 auto;

      width: 100%;
      min-width: 0;
      height: 42px;

      margin: 0;
      padding: 0 12px;

      border: 1px solid var(--gray-300);
      border-right: 0;
      border-radius: 0;

      background: var(--white);
      color: var(--black);

      font-family: "Roboto", Arial, Helvetica, sans-serif;
      font-size: 16px;

      appearance: none;
      -webkit-appearance: none;
    }

    #calendar-search::placeholder {
      color: var(--mid-gray);
      opacity: 1;
    }

    #calendar-search::-webkit-search-cancel-button {
      cursor: pointer;
    }

    #calendar-search:focus {
      position: relative;
      z-index: 2;

      outline: 2px solid var(--brand-primary);
      outline-offset: -2px;
    }

    #calendar-search-form > button {
      display: flex;
      flex: 0 0 42px;
      align-items: center;
      justify-content: center;

      width: 42px;
      height: 42px;

      margin: 0;
      padding: 0;

      border: 1px solid var(--brand-primary);
      border-radius: 0;

      background: var(--brand-primary);
      color: var(--white);
    }

    #calendar-search-form > button:hover,
    #calendar-search-form > button:focus {
      border-color: var(--brand-primary-dark);
      background: var(--brand-primary-dark);
    }

    #calendar-search-form > button:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 2px;
    }

    .search-icon {
      display: block;
      width: 18px;
      height: 18px;
    }


    /* Area filters */

    .primary-filters {
      position: relative;

      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: 22px;

      min-width: 0;
    }

    .filter-button,
    #more-button {
      appearance: none;
      -webkit-appearance: none;

      flex: 0 0 auto;

      margin: 0;
      padding: 7px 0 9px;

      border: 0;
      border-radius: 0;

      background: transparent;
      color: var(--dark-gray);

      font-family: "Roboto", Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.35;

      white-space: nowrap;

      transition: color 180ms ease;
    }

    .filter-button:hover,
    .filter-button:focus,
    #more-button:hover,
    #more-button:focus {
      background: transparent;
      color: var(--brand-primary);
    }

    .filter-button.active {
      color: var(--brand-primary);
    }

    .filter-button:focus-visible,
    #more-button:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 3px;
    }


    /* Sliding underline */

    #filter-indicator {
      position: absolute;
      z-index: 1;

      bottom: 3px;
      left: 0;

      width: 0;
      height: 3px;

      background: var(--brand-primary);

      transform: translateX(0);
      transform-origin: left center;

      pointer-events: none;

      transition:
        transform 280ms cubic-bezier(0.4, 0, 0.2, 1),
        width 280ms cubic-bezier(0.4, 0, 0.2, 1);
    }


    /* More */

    #more-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    #more-button.active {
      color: var(--brand-primary);
    }

    .more-caret {
      display: block;

      width: 7px;
      height: 7px;
      margin-top: -4px;

      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;

      transform: rotate(45deg);

      transition:
        transform 200ms ease,
        margin 200ms ease;
    }

    #more-button[aria-expanded="true"] .more-caret {
      margin-top: 4px;
      transform: rotate(225deg);
    }


    /* Share */

    #share-url {
      appearance: none;
      -webkit-appearance: none;

      flex: 0 0 auto;

      margin: 0 0 0 auto;
      padding: 7px 0 9px;

      border: 0;
      border-radius: 0;

      background: transparent;
      color: var(--mid-gray);

      font-family: "Roboto", Arial, Helvetica, sans-serif;
      font-size: 15px;
      font-weight: 400;

      white-space: nowrap;

      transition: color 150ms ease;
    }

    #share-url:hover,
    #share-url:focus {
      color: var(--brand-primary);
    }

    #share-url:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 3px;
    }


    /* Expanded filters */

    #expanded-filters {
      display: grid;
      grid-template-rows: 0fr;

      width: 100%;
      margin: 0;

      border-top: 1px solid transparent;
      border-bottom: 1px solid transparent;

      transition:
        grid-template-rows 260ms cubic-bezier(0.4, 0, 0.2, 1),
        margin 260ms cubic-bezier(0.4, 0, 0.2, 1),
        border-color 200ms ease;
    }

    #expanded-filters.open {
      grid-template-rows: 1fr;

      margin: 0 0 28px;

      border-top-color: var(--light-gray);
      border-bottom-color: var(--light-gray);
    }

    .expanded-filters-inner {
      min-height: 0;
      overflow: hidden;
    }

    .expanded-filters-content {
      padding: 0;

      opacity: 0;
      transform: translateY(-6px);

      transition:
        opacity 180ms ease,
        transform 260ms cubic-bezier(0.4, 0, 0.2, 1),
        padding 260ms ease;
    }

    #expanded-filters.open .expanded-filters-content {
      padding: 22px 0 24px;

      opacity: 1;
      transform: translateY(0);
    }


    /* Filter group */

    .filter-group {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 28px;
      align-items: start;
    }

    .filter-group-title {
      margin: 0;
      padding: 8px 0;

      color: var(--black);

      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
    }

    .event-type-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
    }

    .event-type-button {
      appearance: none;
      -webkit-appearance: none;

      margin: 0;
      padding: 7px 12px;

      border: 1px solid var(--gray-300);
      border-radius: 0;

      background: var(--white);
      color: var(--dark-gray);

      font-family: "Roboto", Arial, Helvetica, sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.35;

      transition:
        background-color 150ms ease,
        border-color 150ms ease,
        color 150ms ease;
    }

    .event-type-button:hover,
    .event-type-button:focus {
      border-color: var(--brand-primary);
      color: var(--brand-primary);
    }

    .event-type-button.active {
      border-color: var(--brand-primary);
      background: var(--brand-primary);
      color: var(--white);
    }

    .event-type-button.active:hover,
    .event-type-button.active:focus {
      border-color: var(--brand-primary-dark);
      background: var(--brand-primary-dark);
      color: var(--white);
    }

    .event-type-button:focus-visible {
      outline: 2px solid var(--black);
      outline-offset: 2px;
    }


    /* Status */

    #calendar-status {
      margin: 0 0 20px;

      color: var(--mid-gray);

      font-size: 14px;
    }

    #calendar-status:empty {
      display: none;
    }


    /* Localist */

    #localist-widget-dpat {
      clear: both;

      width: 100%;
      margin: 0;
      padding: 0;

      font-family: "Roboto", Arial, Helvetica, sans-serif;
    }


    /* Medium */

    @media (max-width: 1100px) {
      #calendar-filters {
        flex-wrap: wrap;
      }

      #calendar-search-form {
        flex: 0 0 300px;
      }

      .primary-filters {
        order: 3;
        flex: 1 0 100%;
        width: 100%;
      }

      #share-url {
        margin-left: auto;
      }
    }


    /* Mobile */

    @media (max-width: 700px) {
      .brand-header-inner {
        padding: 10px 16px;
      }

      .brand-header-logo {
        width: min(100%, 350px);
      }

      .calendar-page {
        padding: 20px 16px 36px;
      }

      #calendar-filters {
        gap: 14px;
      }

      #calendar-search-form {
        flex: 1 0 100%;
        width: 100%;
        height: 44px;
      }

      #calendar-search {
        height: 44px;
      }

      #calendar-search-form > button {
        flex-basis: 44px;
        width: 44px;
        height: 44px;
      }

      #share-url {
        order: 2;
        margin-left: 0;
      }

      .primary-filters {
        order: 3;

        width: 100%;
        gap: 18px;

        overflow-x: auto;
        overflow-y: hidden;

        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      .primary-filters::-webkit-scrollbar {
        display: none;
      }

      .filter-group {
        display: block;
      }

      .filter-group-title {
        margin-bottom: 10px;
        padding: 0;
      }

      .event-type-filters {
        gap: 8px;
      }
    }


    @media (prefers-reduced-motion: reduce) {
      .filter-button,
      #more-button,
      #filter-indicator,
      .more-caret,
      #expanded-filters,
      .expanded-filters-content,
      .event-type-button {
        transition: none;
      }
    }
  </style>
</head>


<body>

  <header class="brand-header">
    <div class="brand-header-inner">
      <img
        src="D_pat_identifier_RGB_mono_white.svg"
        alt="NC State Department of Performing Arts and Technology"
        class="brand-header-logo"
      >
    </div>
  </header>


  <main class="calendar-page">

    <div
      id="calendar-filters"
      aria-label="Search and filter events"
    >

      <form
        id="calendar-search-form"
        role="search"
      >

        <label
          class="sr-only"
          for="calendar-search"
        >
          Search events
        </label>

        <input
          id="calendar-search"
          type="search"
          placeholder="Search events"
          autocomplete="off"
        >

        <button
          type="submit"
          aria-label="Search events"
        >

          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              cx="10.5"
              cy="10.5"
              r="6.5"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
            ></circle>

            <path
              d="M15.5 15.5L21 21"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="square"
            ></path>
          </svg>

        </button>

      </form>


      <div
        class="primary-filters"
        id="primary-filters"
      >

        <button
          type="button"
          id="filter-all"
          class="filter-button active"
        >
          All
        </button>

        <button
          type="button"
          class="filter-button"
          data-area="music"
        >
          Music
        </button>

        <button
          type="button"
          class="filter-button"
          data-area="dance"
        >
          Dance
        </button>

        <button
          type="button"
          class="filter-button"
          data-area="arts"
        >
          Arts Entrepreneurship
        </button>

        <button
          type="button"
          class="filter-button"
          data-area="tech"
        >
          Music Technology
        </button>


        <button
          type="button"
          id="more-button"
          aria-expanded="false"
          aria-controls="expanded-filters"
        >
          More

          <span
            class="more-caret"
            aria-hidden="true"
          ></span>
        </button>


        <span
          id="filter-indicator"
          aria-hidden="true"
        ></span>

      </div>


      <button
        type="button"
        id="share-url"
      >
        Share
      </button>

    </div>


    <div
      id="expanded-filters"
      aria-hidden="true"
    >

      <div class="expanded-filters-inner">

        <div class="expanded-filters-content">

          <div class="filter-group">

            <p class="filter-group-title">
              Event Type
            </p>

            <div class="event-type-filters">

              <button
                type="button"
                class="event-type-button"
                data-event-type="performance"
                aria-pressed="false"
              >
                Performances
              </button>

              <button
                type="button"
                class="event-type-button"
                data-event-type="masterclass"
                aria-pressed="false"
              >
                Master Classes
              </button>

              <button
                type="button"
                class="event-type-button"
                data-event-type="audition"
                aria-pressed="false"
              >
                Auditions
              </button>

              <button
                type="button"
                class="event-type-button"
                data-event-type="workshop"
                aria-pressed="false"
              >
                Workshops &amp; Talks
              </button>

            </div>

          </div>

        </div>

      </div>

    </div>


    <div
      id="calendar-status"
      aria-live="polite"
    ></div>


    <div
      id="localist-widget-dpat"
      class="localist-widget"
    ></div>

  </main>


  <script>
    (function () {

      const BASE =
        "https://calendar.ncsu.edu/widget/view";


      const AREAS = {
        music: {
          tags: ["Music"]
        },

        dance: {
          tags: ["Dance"]
        },

        arts: {
          tags: ["Arts Entrepreneurship"]
        },

        tech: {
          tags: ["Music Technology"]
        }
      };


      const EVENT_TYPES = {
        performance: {
          tags: ["Performance"]
        },

        masterclass: {
          tags: ["Master Class Series"]
        },

        audition: {
          tags: ["Audition"]
        },

        workshop: {
          tags: ["Workshop"]
        }
      };


      const container =
        document.getElementById("localist-widget-dpat");

      const allButton =
        document.getElementById("filter-all");

      const primaryFilters =
        document.getElementById("primary-filters");

      const indicator =
        document.getElementById("filter-indicator");

      const areaButtons =
        Array.from(
          document.querySelectorAll("[data-area]")
        );

      const eventButtons =
        Array.from(
          document.querySelectorAll("[data-event-type]")
        );

      const moreButton =
        document.getElementById("more-button");

      const expandedFilters =
        document.getElementById("expanded-filters");

      const shareButton =
        document.getElementById("share-url");

      const searchForm =
        document.getElementById("calendar-search-form");

      const searchInput =
        document.getElementById("calendar-search");

      const status =
        document.getElementById("calendar-status");


      let activeArea = null;
      let activeEventTypes = [];
      let searchQuery = "";
      let searchTimers = [];


      function normalize(value) {
        return String(value || "")
          .trim()
          .toLocaleLowerCase();
      }


      function findKey(value, config) {
        if (!value) {
          return null;
        }

        const normalized =
          normalize(value);

        return (
          Object.keys(config).find(
            key => normalize(key) === normalized
          ) || null
        );
      }


      function unique(values) {
        return Array.from(
          new Set(values)
        );
      }


      function getActiveTopButton() {
        if (!activeArea) {
          return allButton;
        }

        return (
          areaButtons.find(
            button =>
              button.dataset.area === activeArea
          ) || allButton
        );
      }


      function moveFilterIndicator(animate = true) {
        const button =
          getActiveTopButton();

        if (!button) {
          return;
        }

        if (!animate) {
          indicator.style.transition = "none";
        }

        const navRect =
          primaryFilters.getBoundingClientRect();

        const buttonRect =
          button.getBoundingClientRect();

        const left =
          buttonRect.left -
          navRect.left +
          primaryFilters.scrollLeft;

        indicator.style.width =
          buttonRect.width + "px";

        indicator.style.transform =
          "translateX(" + left + "px)";

        if (!animate) {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              indicator.style.transition = "";
            });
          });
        }
      }


      function keepActiveFilterVisible() {
        if (window.innerWidth > 700) {
          return;
        }

        const button =
          getActiveTopButton();

        if (!button) {
          return;
        }

        button.scrollIntoView({
          behavior: "smooth",
          block: "nearest",
          inline: "nearest"
        });
      }


      function readURL() {
        const params =
          new URLSearchParams(
            window.location.search
          );

        activeArea =
          findKey(
            params.get("area"),
            AREAS
          );

        activeEventTypes =
          unique(
            params
              .getAll("type")
              .map(
                value =>
                  findKey(
                    value,
                    EVENT_TYPES
                  )
              )
              .filter(Boolean)
          );

        searchQuery =
          params.get("q") || "";

        searchInput.value =
          searchQuery;
      }


      function updateURL() {
        const url =
          new URL(
            window.location.href
          );

        url.searchParams.delete("area");
        url.searchParams.delete("type");
        url.searchParams.delete("q");

        if (activeArea) {
          url.searchParams.set(
            "area",
            activeArea
          );
        }

        activeEventTypes.forEach(
          type => {
            url.searchParams.append(
              "type",
              type
            );
          }
        );

        if (searchQuery) {
          url.searchParams.set(
            "q",
            searchQuery
          );
        }

        history.replaceState(
          null,
          "",
          url
        );
      }


      function updateControls(animate = true) {

        areaButtons.forEach(
          button => {

            const active =
              button.dataset.area ===
              activeArea;

            button.classList.toggle(
              "active",
              active
            );

            button.setAttribute(
              "aria-pressed",
              active ? "true" : "false"
            );
          }
        );


        const allActive =
          !activeArea;

        allButton.classList.toggle(
          "active",
          allActive
        );

        allButton.setAttribute(
          "aria-pressed",
          allActive ? "true" : "false"
        );


        eventButtons.forEach(
          button => {

            const active =
              activeEventTypes.includes(
                button.dataset.eventType
              );

            button.classList.toggle(
              "active",
              active
            );

            button.setAttribute(
              "aria-pressed",
              active ? "true" : "false"
            );
          }
        );


        moreButton.classList.toggle(
          "active",
          activeEventTypes.length > 0
        );


        requestAnimationFrame(
          function () {
            moveFilterIndicator(animate);
            keepActiveFilterVisible();
          }
        );
      }


      function getAreaTags() {
        if (
          !activeArea ||
          !AREAS[activeArea]
        ) {
          return [];
        }

        return AREAS[activeArea].tags || [];
      }


      function getEventTypeTags(type) {
        if (
          !type ||
          !EVENT_TYPES[type]
        ) {
          return [];
        }

        return EVENT_TYPES[type].tags || [];
      }


      function buildWidgetURL(
        eventType = null,
        containerId = "localist-widget-dpat"
      ) {
        const params =
          new URLSearchParams();

        params.set(
          "schools",
          "ncsu"
        );

        params.set(
          "groups",
          "department_of_performing_arts_and_technology"
        );

        params.set(
          "days",
          "365"
        );

        params.set(
          "num",
          "50"
        );

        params.set(
          "match",
          "all"
        );

        params.set(
          "experience",
          "inperson"
        );

        params.set(
          "container",
          containerId
        );

        params.set(
          "template",
          "widget-template-7"
        );


        let tags =
          getAreaTags();


        if (eventType) {
          tags = tags.concat(
            getEventTypeTags(eventType)
          );
        }


        tags =
          unique(tags);


        if (tags.length) {
          params.set(
            "tags",
            tags.join(",")
          );
        }


        return (
          BASE +
          "?" +
          params.toString()
        );
      }


      function clearSearchTimers() {
        searchTimers.forEach(
          timer =>
            clearTimeout(timer)
        );

        searchTimers = [];
      }


      function getEventItems(root) {
        const scope =
          root || container;

        const standard =
          Array.from(
            scope.querySelectorAll(
              "li.lw_event_item"
            )
          );

        if (standard.length) {
          return standard;
        }

        return Array.from(
          scope.querySelectorAll("li")
        ).filter(
          item =>
            item.querySelector(
              'a[href*="/event/"]'
            )
        );
      }


      function getEventIdentity(event) {
        const link =
          event.querySelector(
            'a[href*="/event/"]'
          );

        if (link) {
          return link.href;
        }

        return normalize(
          event.textContent
        );
      }


      function applySearch() {
        const query =
          normalize(searchQuery);

        const events =
          getEventItems(container);

        if (!events.length) {
          return;
        }

        let visible = 0;

        events.forEach(
          event => {

            const matches =
              !query ||
              normalize(
                event.textContent
              ).includes(query);

            event.style.display =
              matches ? "" : "none";

            if (matches) {
              visible++;
            }
          }
        );


        if (query) {
          status.textContent =
            visible === 1
              ? "1 event found"
              : visible + " events found";
        }

        else {
          status.textContent = "";
        }
      }


      function scheduleSearch() {
        clearSearchTimers();

        [500, 1000, 1800, 3000].forEach(
          delay => {

            searchTimers.push(
              setTimeout(
                applySearch,
                delay
              )
            );

          }
        );
      }


      function clearWidgetScripts() {
        document
          .querySelectorAll(
            "script[data-dpat-widget]"
          )
          .forEach(
            script => script.remove()
          );
      }


      function loadSingleWidget() {
        clearWidgetScripts();

        container.innerHTML = "";

        const script =
          document.createElement("script");

        script.type =
          "text/javascript";

        script.async =
          true;

        script.setAttribute(
          "data-dpat-widget",
          "true"
        );

        script.src =
          buildWidgetURL();

        container.parentNode.insertBefore(
          script,
          container.nextSibling
        );

        scheduleSearch();
      }


      function loadMultipleWidgets() {
        clearWidgetScripts();

        container.innerHTML = "";

        const staging =
          document.createElement("div");

        staging.style.display = "none";

        document.body.appendChild(staging);

        const loads = [];


        activeEventTypes.forEach(
          function (type, index) {

            loads.push(
              new Promise(
                function (resolve) {

                  const id =
                    "localist-temp-" +
                    Date.now() +
                    "-" +
                    index;

                  const temp =
                    document.createElement("div");

                  temp.id = id;

                  staging.appendChild(temp);


                  const script =
                    document.createElement("script");

                  script.type =
                    "text/javascript";

                  script.async =
                    true;

                  script.setAttribute(
                    "data-dpat-widget",
                    "true"
                  );

                  script.src =
                    buildWidgetURL(
                      type,
                      id
                    );


                  staging.appendChild(
                    script
                  );


                  let attempts = 0;


                  const check =
                    setInterval(
                      function () {

                        attempts++;

                        const events =
                          getEventItems(temp);


                        if (
                          events.length ||
                          attempts >= 30
                        ) {
                          clearInterval(check);

                          resolve(
                            events.map(
                              event =>
                                event.cloneNode(true)
                            )
                          );
                        }

                      },
                      150
                    );

                }
              )
            );

          }
        );


        Promise.all(loads)
          .then(
            function (groups) {

              const seen =
                new Set();

              const events = [];


              groups
                .flat()
                .forEach(
                  event => {

                    const identity =
                      getEventIdentity(event);

                    if (
                      !seen.has(identity)
                    ) {
                      seen.add(identity);
                      events.push(event);
                    }

                  }
                );


              const list =
                document.createElement("ul");

              const firstSourceList =
                staging.querySelector("ul");


              if (firstSourceList) {
                list.className =
                  firstSourceList.className;
              }


              events.forEach(
                event => {
                  list.appendChild(event);
                }
              );


              container.innerHTML = "";


              if (events.length) {
                container.appendChild(list);
              }


              staging.remove();

              applySearch();
            }
          );
      }


      function loadWidget() {
        status.textContent = "";

        clearSearchTimers();


        if (
          activeEventTypes.length <= 1
        ) {

          if (
            activeEventTypes.length === 1
          ) {
            clearWidgetScripts();

            container.innerHTML = "";

            const script =
              document.createElement("script");

            script.type =
              "text/javascript";

            script.async =
              true;

            script.setAttribute(
              "data-dpat-widget",
              "true"
            );

            script.src =
              buildWidgetURL(
                activeEventTypes[0]
              );

            container.parentNode.insertBefore(
              script,
              container.nextSibling
            );

            scheduleSearch();
          }

          else {
            loadSingleWidget();
          }

          return;
        }


        loadMultipleWidgets();
      }


      function openFilters() {
        expandedFilters.classList.add(
          "open"
        );

        expandedFilters.setAttribute(
          "aria-hidden",
          "false"
        );

        moreButton.setAttribute(
          "aria-expanded",
          "true"
        );
      }


      function closeFilters() {
        expandedFilters.classList.remove(
          "open"
        );

        expandedFilters.setAttribute(
          "aria-hidden",
          "true"
        );

        moreButton.setAttribute(
          "aria-expanded",
          "false"
        );
      }


      function toggleFilters() {
        if (
          expandedFilters.classList.contains(
            "open"
          )
        ) {
          closeFilters();
        }

        else {
          openFilters();
        }
      }


      areaButtons.forEach(
        button => {

          button.addEventListener(
            "click",
            function () {

              const value =
                button.dataset.area;

              activeArea =
                activeArea === value
                  ? null
                  : value;

              updateControls(true);
              updateURL();
              loadWidget();
            }
          );

        }
      );


      allButton.addEventListener(
        "click",
        function () {

          activeArea = null;

          updateControls(true);
          updateURL();
          loadWidget();

        }
      );


      eventButtons.forEach(
        button => {

          button.addEventListener(
            "click",
            function () {

              const value =
                button.dataset.eventType;

              if (
                activeEventTypes.includes(
                  value
                )
              ) {

                activeEventTypes =
                  activeEventTypes.filter(
                    type =>
                      type !== value
                  );

              }

              else {

                activeEventTypes =
                  activeEventTypes.concat(
                    value
                  );

              }


              updateControls(true);
              updateURL();
              loadWidget();

            }
          );

        }
      );


      moreButton.addEventListener(
        "click",
        toggleFilters
      );


      searchForm.addEventListener(
        "submit",
        function (event) {

          event.preventDefault();

          searchQuery =
            searchInput.value.trim();

          updateURL();
          applySearch();

        }
      );


      searchInput.addEventListener(
        "input",
        function () {

          searchQuery =
            searchInput.value.trim();

          updateURL();
          applySearch();

        }
      );


      shareButton.addEventListener(
        "click",
        async function () {

          searchQuery =
            searchInput.value.trim();

          updateURL();

          const url =
            window.location.href;


          try {

            if (
              navigator.share
            ) {

              await navigator.share({
                title:
                  "NC State Performing Arts and Technology Events",
                url: url
              });

              return;
            }


            await navigator.clipboard.writeText(
              url
            );

          }

          catch (error) {

            if (
              error &&
              error.name === "AbortError"
            ) {
              return;
            }


            try {

              await navigator.clipboard.writeText(
                url
              );

            }

            catch (clipboardError) {

              const field =
                document.createElement(
                  "textarea"
                );

              field.value = url;

              field.style.position =
                "fixed";

              field.style.opacity =
                "0";

              document.body.appendChild(
                field
              );

              field.select();

              document.execCommand(
                "copy"
              );

              field.remove();

            }

          }


          shareButton.textContent =
            "Link copied";


          setTimeout(
            function () {

              shareButton.textContent =
                "Share";

            },
            1500
          );

        }
      );


      primaryFilters.addEventListener(
        "scroll",
        function () {
          moveFilterIndicator(false);
        },
        {
          passive: true
        }
      );


      window.addEventListener(
        "resize",
        function () {
          moveFilterIndicator(false);
        }
      );


      window.addEventListener(
        "popstate",
        function () {

          readURL();
          updateControls(false);
          loadWidget();

        }
      );


      readURL();
      updateControls(false);

      if (
        activeEventTypes.length
      ) {
        openFilters();
      }

      loadWidget();

    })();
  </script>

</body>
</html>
