<style>
  :root {
    --brand-primary: #cc0000;
    --brand-primary-dark: #990000;
    --brand-primary-extra-dark: #5e0000;

    --white: #ffffff;
    --black: #000000;

    --very-light-gray: #f2f2f2;
    --light-gray: #cccccc;
    --mid-gray: #666666;
    --dark-gray: #333333;
    --gray-100: #e5e5e5;
    --gray-300: #b2b2b2;

    --max-width: 1200px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: var(--white);
    color: var(--black);
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  button,
  input {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }


  /* Header */

  .brand-header {
    width: 100%;
    background: var(--brand-primary);
  }

  .brand-header-inner {
    width: 100%;
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 0 10px;
  }

  .brand-header-logo {
    display: block;
    width: min(100%, 400px);
    height: auto;
  }


  /* Page */

  .calendar-page {
    width: 100%;
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 24px 24px 48px;
  }


  /* Toolbar */

  #calendar-filters {
    display: flex;
    align-items: center;
    gap: 12px 22px;
    width: 100%;
    margin: 0 0 28px;
  }


  /* Search */

  #calendar-search-form {
    display: flex;
    flex: 0 1 300px;
    width: 300px;
    min-width: 220px;
    height: 42px;
    margin: 0;
  }

  #calendar-search {
    display: block;
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    height: 42px;
    margin: 0;
    padding: 0 12px;

    border: 1px solid var(--gray-300);
    border-right: 0;
    border-radius: 0;

    background: var(--white);
    color: var(--black);

    font-size: 16px;
    line-height: 1;

    appearance: none;
    -webkit-appearance: none;
  }

  #calendar-search::placeholder {
    color: var(--mid-gray);
    opacity: 1;
  }

  #calendar-search::-webkit-search-cancel-button {
    cursor: pointer;
  }

  #calendar-search:focus {
    position: relative;
    z-index: 2;
    outline: 2px solid var(--brand-primary);
    outline-offset: -2px;
  }

  #calendar-search-form > button {
    display: flex;
    flex: 0 0 42px;
    align-items: center;
    justify-content: center;

    width: 42px;
    height: 42px;
    margin: 0;
    padding: 0;

    border: 1px solid var(--brand-primary);
    border-radius: 0;

    background: var(--brand-primary);
    color: var(--white);
  }

  #calendar-search-form > button:hover,
  #calendar-search-form > button:focus {
    border-color: var(--brand-primary-dark);
    background: var(--brand-primary-dark);
    color: var(--white);
  }

  #calendar-search-form > button:focus-visible {
    outline: 2px solid var(--black);
    outline-offset: 2px;
  }

  .search-icon {
    display: block;
    width: 18px;
    height: 18px;
  }


  /* Filters */

  .primary-filters {
    display: flex;
    flex: 1 1 auto;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 22px;
    min-width: 0;
  }

  #calendar-filters .filter-button,
  #more-button,
  #copy-url {
    appearance: none;
    -webkit-appearance: none;

    width: auto;
    min-width: 0;
    height: auto;
    min-height: 0;

    margin: 0;
    padding: 4px 0 5px;

    border: 0;
    border-bottom: 3px solid transparent;
    border-radius: 0;

    background: transparent;
    box-shadow: none;

    color: var(--dark-gray);

    font-size: 16px;
    font-weight: 400;
    line-height: 1.35;

    text-align: left;
    text-transform: none;
    text-decoration: none;

    white-space: nowrap;
  }

  #calendar-filters .filter-button:hover,
  #calendar-filters .filter-button:focus,
  #more-button:hover,
  #more-button:focus,
  #copy-url:hover,
  #copy-url:focus {
    background: transparent;
    color: var(--brand-primary);
  }

  #calendar-filters .filter-button:focus-visible,
  #more-button:focus-visible,
  #copy-url:focus-visible {
    outline: 2px solid var(--black);
    outline-offset: 3px;
  }

  #calendar-filters .filter-button.active {
    border-bottom-color: var(--brand-primary);
    color: var(--brand-primary);
    font-weight: 400;
  }


  /* More */

  #more-wrap {
    position: relative;
    display: inline-block;
    flex: 0 0 auto;
  }

  #more-button {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  #more-button.active {
    border-bottom-color: var(--brand-primary);
    color: var(--brand-primary);
    font-weight: 400;
  }

  .more-caret {
    display: block;
    width: 7px;
    height: 7px;
    margin-top: -4px;

    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;

    transform: rotate(45deg);
    transition: transform 0.15s ease;
  }

  #more-button[aria-expanded="true"] .more-caret {
    margin-top: 4px;
    transform: rotate(225deg);
  }


  /* More menu */

  #more-menu {
    position: absolute;
    z-index: 1000;

    top: calc(100% + 9px);
    left: -16px;

    width: max-content;
    min-width: 225px;

    margin: 0;
    padding: 8px 0;

    border: 0;

    background: var(--brand-primary-dark);
    box-shadow: none;
  }

  #more-menu[hidden] {
    display: none;
  }

  #more-menu::before {
    content: "";
    position: absolute;

    top: -8px;
    left: 18px;

    width: 0;
    height: 0;

    border-right: 8px solid transparent;
    border-bottom: 8px solid var(--brand-primary-dark);
    border-left: 8px solid transparent;
  }

  #more-menu button {
    appearance: none;
    -webkit-appearance: none;

    display: block;

    width: 100%;
    min-width: 0;
    height: auto;
    min-height: 0;

    margin: 0;
    padding: 9px 18px;

    border: 0;
    border-radius: 0;

    background: transparent;
    box-shadow: none;

    color: var(--white);

    font: inherit;
    font-size: 15px;
    font-weight: 400;
    line-height: 1.35;

    text-align: left;
    text-transform: none;
    text-decoration: none;

    white-space: nowrap;
  }

  #more-menu button:hover,
  #more-menu button:focus {
    background: transparent;
    color: var(--light-gray);
  }

  #more-menu button:focus-visible {
    outline: 2px solid var(--white);
    outline-offset: -4px;
  }

  #more-menu button.active {
    background: transparent;
    color: var(--white);
    font-weight: 400;

    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 4px;
  }


  /* Copy URL */

  #copy-url {
    flex: 0 0 auto;
    margin-left: auto;

    border-bottom: 0;

    color: var(--mid-gray);
    font-size: 15px;
    font-weight: 400;
  }


  /* Status */

  #calendar-status {
    margin: -14px 0 20px;
    color: var(--mid-gray);
    font-size: 14px;
  }

  #calendar-status:empty {
    display: none;
  }


  /* Localist */

  #localist-widget-dpat {
    clear: both;
    width: 100%;
    margin: 0;
    padding: 0;
  }


  /* Medium screens */

  @media (max-width: 1050px) {
    #calendar-filters {
      flex-wrap: wrap;
      align-items: flex-start;
    }

    #calendar-search-form {
      flex: 0 0 300px;
    }

    .primary-filters {
      flex: 1 1 500px;
    }

    #copy-url {
      margin-left: 0;
    }
  }


  /* Tablet */

  @media (max-width: 850px) {
    #calendar-filters {
      display: block;
    }

    #calendar-search-form {
      width: 100%;
      max-width: 420px;
      margin-bottom: 18px;
    }

    .primary-filters {
      display: flex;
      width: 100%;
    }

    #copy-url {
      margin-top: 14px;
    }
  }


  /* Mobile */

  @media (max-width: 700px) {
    .brand-header-inner {
      padding: 10px 16px;
    }

    .brand-header-logo {
      width: min(100%, 350px);
    }

    .calendar-page {
      padding: 20px 16px 36px;
    }

    #calendar-filters {
      margin-bottom: 24px;
    }

    #calendar-search-form {
      max-width: none;
      height: 44px;
    }

    #calendar-search {
      height: 44px;
    }

    #calendar-search-form > button {
      flex-basis: 44px;
      width: 44px;
      height: 44px;
    }

    .primary-filters {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0;
    }

    #calendar-filters .filter-button,
    #more-button {
      display: flex;
      align-items: center;

      width: 100%;
      min-height: 44px;

      padding: 10px 0;

      border-bottom: 1px solid var(--light-gray);

      white-space: normal;
    }

    #calendar-filters .filter-button.active {
      border-bottom: 3px solid var(--brand-primary);
    }

    #more-wrap {
      display: block;
      width: 100%;
    }

    #more-button {
      justify-content: space-between;
    }

    #more-button.active {
      border-bottom: 3px solid var(--brand-primary);
    }

    #more-menu {
      top: 100%;
      right: auto;
      left: 0;

      width: min(280px, calc(100vw - 32px));
      min-width: 0;
    }

    #copy-url {
      margin-top: 16px;
    }
  }


  /* Small mobile */

  @media (max-width: 480px) {
    .primary-filters {
      grid-template-columns: 1fr;
    }

    #more-menu {
      position: static;

      width: 100%;
      min-width: 0;

      margin-top: 0;
    }

    #more-menu::before {
      display: none;
    }
  }
</style>
