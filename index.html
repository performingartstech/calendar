<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DPAT Events</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .calendar {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .calendar-tools {
      margin-bottom: 20px;
    }

    .calendar-search {
      width: 100%;
      min-height: 44px;
      padding: 9px 12px;
      margin: 0 0 14px;

      border: 1px solid #999;
      background: #fff;

      font: inherit;
    }

    .calendar-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 22px;

      padding-bottom: 14px;
      border-bottom: 1px solid #ddd;
    }

    .calendar-filters button {
      appearance: none;
      border: 0;
      padding: 2px 0;

      background: transparent;
      color: #333;

      font: inherit;
      cursor: pointer;
    }

    .calendar-filters button:hover,
    .calendar-filters button.active {
      color: #cc0000;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    #localist-widget-71703993 {
      width: 100%;
    }

    #lclst_widget_footer {
      margin-top: 10px;
    }

    @media (max-width: 700px) {
      .calendar {
        padding: 16px;
      }

      .calendar-filters {
        gap: 9px 16px;
      }
    }
  </style>
</head>

<body>

  <main class="calendar">

    <div class="calendar-tools">

      <input
        class="calendar-search"
        type="search"
        placeholder="Search events…"
        aria-label="Search events"
      >

      <div class="calendar-filters">
        <button type="button" class="active">All</button>
        <button type="button">Music</button>
        <button type="button">Dance</button>
        <button type="button">Arts Entrepreneurship</button>
        <button type="button">Music Technology</button>
        <button type="button">More</button>
      </div>

    </div>


    <div
      id="localist-widget-71703993"
      class="localist-widget">
    </div>

    <script
      defer
      type="text/javascript"
      src="https://calendar.ncsu.edu/widget/view?schools=ncsu&groups=department_of_performing_arts_and_technology&days=365&num=50&experience=inperson&container=localist-widget-71703993&template=widget-template-7">
    </script>

    <div id="lclst_widget_footer">
      <a
        style="margin-left:auto;margin-right:auto;display:block;width:81px;margin-top:10px;"
        title="Widget powered by Concept3D Event Calendar Software"
        href="https://www.localist.com?utm_source=widget&utm_campaign=widget_footer&utm_medium=branded%20link">

        <img
          src="//d3e1o4bcbhmj8g.cloudfront.net/assets/platforms/default/about/widget_footer.png"
          alt="Localist Online Calendar Software"
          style="vertical-align:middle;"
          width="81"
          height="23">

      </a>
    </div>

  </main>

</body>
</html>
